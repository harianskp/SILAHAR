<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SILAHAR - Laporan Harian ASN</title><link rel="preconnect" href="https://script.google.com" crossorigin><link rel="preconnect" href="https://script.googleusercontent.com" crossorigin><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0B7A75"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="SILAHAR"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="icons/silahar-ios-180.png"><link rel="icon" href="icons/silahar-192.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#F2F5F7;--ink:#0F2530;--muted:#4E606B;--line:#E1E7EB;--line2:#CBD6DC;--pri:#0B7A75;--pri-d:#096661;--pri-t:#075E5A;--dark:#0C2830;--amb:#F2A33A;--teal-l:#E3F3F1;--amb-l:#FFF0D3;--danger:#B3261E;--danger-l:#FCE9E7;--blue-l:#E6EDFB;--blue:#2A4E9B;--pur-l:#F1E7FA;--pur:#6B2E9B;--ok:#1F6B3A}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.4;color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
a{color:inherit}
h1,h2,h3,p{margin:0}
.display{font-family:'Bricolage Grotesque','Plus Jakarta Sans',system-ui,sans-serif}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--amb);outline-offset:2px}

/* loader */
#loadbar{position:fixed;left:0;top:0;height:3px;width:100%;z-index:100;background:linear-gradient(90deg,transparent,var(--amb),transparent);background-size:50% 100%;background-repeat:no-repeat;animation:ld 1s linear infinite;display:none}
#loadbar.on{display:block}
@keyframes ld{from{background-position:-50% 0}to{background-position:150% 0}}
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--muted);font-weight:600}

/* primitives */
.card{background:#fff;border:1px solid var(--line);border-radius:18px}
.btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:0;border-radius:12px;background:var(--pri);color:#fff;font-size:14px;font-weight:700;text-decoration:none}
.btn-primary:hover:not(:disabled){background:var(--pri-d)}
.btn-ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid var(--line2);border-radius:12px;background:#fff;color:var(--ink);font-size:14px;font-weight:600;text-decoration:none}
.btn-ghost:hover:not(:disabled){background:var(--bg)}
.btn-danger{background:var(--danger)}.btn-danger:hover:not(:disabled){background:#8f1d17}
.btn-sm{min-height:36px;padding:0 12px;font-size:13px}
.btn-icon{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:1px solid var(--line2);border-radius:12px;background:#fff;color:var(--pri);flex:none}
.btn-icon:hover:not(:disabled){background:var(--teal-l)}
.btn-icon.danger{color:var(--danger)}.btn-icon.danger:hover:not(:disabled){background:var(--danger-l)}
.btn-icon.sm{width:36px;height:36px}
.field{width:100%;min-height:44px;padding:0 12px;border:1px solid var(--line2);border-radius:10px;background:#fff;color:var(--ink);font:inherit;font-size:14px}
textarea.field{padding:10px 12px;min-height:84px;resize:vertical;line-height:1.5}
select.field{padding-right:8px}
.field.err{border-color:var(--danger);background:#FFF8F7}
.errtxt{margin-top:4px;font-size:12px;font-weight:600;color:var(--danger)}
.th{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.lbl{display:block;margin-bottom:6px}
.badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;background:var(--teal-l);color:var(--pri-t);font-size:12px;font-weight:700;white-space:nowrap}
.badge.amber{background:var(--amb-l);color:#6B4300}
.badge.gray{background:#EEF2F4;color:#2B3F4A}
.badge.red{background:var(--danger-l);color:#8A1C14}
.badge.blue{background:var(--blue-l);color:var(--blue)}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.row.end{justify-content:flex-end}.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:20px}
.pad{padding:24px}
.h3{font-size:18px;font-weight:800}
.sep{height:1px;background:var(--line);margin:0}
.note{padding:14px 16px;border-radius:12px;background:var(--teal-l);color:#064B47;font-size:13px;line-height:1.55}
.note.warn{background:var(--amb-l);color:#4A2F00}
.note.bad{background:var(--danger-l);color:#8A1C14}
.empty{padding:32px;text-align:center;font-size:14px;line-height:1.6;color:var(--muted)}
.bar{height:12px;border-radius:999px;background:#E6ECEF;overflow:hidden}.bar>i{display:block;height:100%;border-radius:999px;background:var(--pri)}
.bar.sm{height:10px}.bar.warn>i{background:#C2761A}

/* shell */
.shell{display:flex;min-height:100vh}
.side{flex:0 0 256px;background:var(--dark);padding:24px 16px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px}
.logo{width:44px;height:44px;border-radius:12px;background:#0F7F78;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.logo.dark{background:#0F7F78}
.nav{display:flex;flex-direction:column;gap:6px}
.nav-h{padding:12px 14px 4px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#7FA0A8}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 14px;border:0;border-radius:12px;background:transparent;color:#C7D8DC;font-size:14px;font-weight:600;text-align:left}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.on{background:var(--amb);color:#1B1203}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:14px}
.side-note{padding:14px;border-radius:14px;background:rgba(255,255,255,.07);color:#C7D8DC;font-size:13px;line-height:1.5}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.head-prof{display:none}
.avatar.mini{width:22px;height:22px;font-size:12px}
.logout{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 14px;border-radius:12px;color:#C7D8DC;font-size:14px;font-weight:600;border:1px solid rgba(255,255,255,.16);background:transparent;width:100%}
.logout:hover{background:rgba(255,255,255,.08)}
.main{flex:1 1 0;min-width:0;padding:32px 36px 56px}
.head{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-bottom:28px}
.head h1{margin-top:4px;font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.01em}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line)}
.tab{min-height:44px;padding:0 16px;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--muted);font-size:14px;font-weight:700}
.tab.on{color:var(--pri);border-bottom-color:var(--pri)}
.bottomnav{display:none}

/* hero & kpi */
.hero{display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between;padding:28px 32px;border-radius:22px;background:var(--pri);color:#fff}
.hero h2{margin:8px 0 12px;font-size:30px;line-height:1.15;font-weight:700}
.ring{position:relative;width:148px;height:148px;flex:none}
.ringm{position:relative;width:132px;height:132px;flex:none}
.ringm .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 22px}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.kpis{display:flex;flex-wrap:wrap;gap:16px}
.kpi{flex:1 1 240px;padding:18px}
.kpi .ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.kpi .kh{display:flex;align-items:center;gap:10px;min-width:0}
.kpi .kh .ico{width:34px;height:34px;border-radius:10px;flex:none}
.kpi .cap{font-size:14px;color:var(--muted);font-weight:700;min-width:0}
.kpi .kvs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:14px}
.kpi .kv+.kv{border-left:1px solid var(--line);padding-left:14px}
.kpi .kl{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.kpi .num{margin-top:6px;font-size:30px;font-weight:700;line-height:1}
.kpi .ks{margin-top:5px;font-size:12px;color:var(--muted);font-weight:600}
.cols{display:flex;flex-wrap:wrap;gap:20px}
.cols>.card{min-width:0}
.bars{position:relative;height:200px;margin-top:20px}
.bars .tgt{position:absolute;left:0;right:0;border-top:2px dashed #C2761A}
.bars .in{position:absolute;inset:0;display:flex;align-items:flex-end;gap:12px}
.bars .col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bars .col b{font-size:12px;color:var(--muted);margin-bottom:4px}
.bars .col i{display:block;width:100%;max-width:56px;border-radius:10px 10px 4px 4px;background:var(--pri)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dh{text-align:center;font-size:11px;font-weight:700;color:var(--muted)}
.hm{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:1;border-radius:8px;font-size:11px;font-weight:700;border:0;padding:0;font-family:inherit}
button.hm{cursor:pointer}button.hm:hover{outline:2px solid var(--dark)}
.hm.blank{background:transparent}.hm.off{background:var(--bg);color:#8A9AA3}.hm.fut{background:#fff;border:1px dashed var(--line2);color:#8A9AA3}
.hm.lvl0{background:var(--danger-l);color:#8A1C14}.hm.lvl1{background:#CFEAE6;color:#064B47}.hm.lvl2{background:#8DD1C9;color:#064B47}.hm.lvl3{background:#2FA196;color:#06322F}.hm.lvl4{background:var(--pri);color:#fff}
.hm.today{background:var(--amb);color:#1B1203;box-shadow:0 0 0 3px #FFE2B0}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px;font-size:12px;color:var(--muted);font-weight:600}
.legend .hm{width:18px}
.item{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.item .no{flex:none;width:28px;height:28px;border-radius:50%;background:var(--teal-l);color:var(--pri-t);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}

/* laporan */
.entry-wrap{overflow-x:auto;padding-bottom:4px}
.entry-in{min-width:1040px}
.entry{display:grid;grid-template-columns:36px minmax(170px,1.1fr) minmax(170px,1.1fr) minmax(220px,2fr) 124px;gap:12px;align-items:start}
.entry-card{padding:16px;margin-bottom:12px}
.entry-card.bad{border-color:var(--danger)}
.pick{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:44px;padding:0 12px;border:1.5px dashed var(--pri);border-radius:10px;background:var(--teal-l);color:var(--pri-t);font-size:14px;font-weight:700;text-align:left}
.pick:hover{background:#D2ECE9}.pick span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick.err{border-color:var(--danger);background:#FFF8F7;color:var(--danger)}
.photos{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px;padding-top:16px;border-top:1px dashed var(--line2)}
.photo{position:relative;width:84px;height:84px;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#2B4A52;background:#E6ECEF;border:1px solid rgba(15,37,48,.12);padding:0;cursor:zoom-in}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .rm{position:absolute;top:4px;right:4px;width:24px;height:24px;border:0;border-radius:50%;background:rgba(15,37,48,.78);color:#fff;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.addphoto{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:84px;padding:0 18px;border:1.5px dashed var(--pri);border-radius:12px;background:#fff;color:var(--pri-t);font-size:13px;font-weight:700;cursor:pointer}
.addphoto:hover{background:var(--teal-l)}.addphoto:focus-within{outline:3px solid var(--amb);outline-offset:2px}
.addphoto input{position:absolute;width:1px;height:1px;opacity:0}
.addbar{width:100%;justify-content:center;min-height:54px;border-style:dashed;border-width:2px;color:var(--pri-t)}

/* tabel */
.trow{display:grid;gap:12px;align-items:center;padding:14px 20px;border-top:1px solid var(--line);font-size:14px}
.trow:hover{background:#F7FAFA}.trow.h{background:#EEF2F4;border-top:0}.trow.h:hover{background:#EEF2F4}
.grp{padding:10px 20px;background:#D9EFEC;color:#064B47;font-size:13px;font-weight:800}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:#EEF2F4;text-align:left;padding:10px 12px;font-size:12px;font-weight:800;letter-spacing:.03em;color:var(--muted);white-space:nowrap}
.tbl td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
.tbl tr:hover td{background:#F7FAFA}
.tbl .num{text-align:right;white-space:nowrap}
.scroll-x{overflow-x:auto}
.kitem{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:16px 20px;border-top:1px solid var(--line)}
.kitem:hover{background:#F7FAFA}
.pager{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 20px;border-top:1px solid var(--line)}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;padding:18px 20px}
.filters>div{flex:1 1 150px;min-width:130px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:#fff;border:1px solid var(--line2);font-size:13px;font-weight:700;color:var(--muted)}
.chip b{color:var(--ink)}

/* modal & toast */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(12,40,48,.58);display:flex;justify-content:center;align-items:flex-start;padding:48px 20px 24px;overflow-y:auto}
.modal{width:100%;max-width:820px;background:#fff;border-radius:22px;box-shadow:0 24px 60px rgba(12,40,48,.35);overflow:hidden}
.modal.sm{max-width:480px}.modal.wide{max-width:1040px}
.modal-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:22px 26px 0}
.modal-b{padding:18px 26px 26px}
.toast-box{position:fixed;right:24px;bottom:24px;z-index:80;display:flex;flex-direction:column;gap:10px;max-width:380px}
.toast{padding:14px 18px;border-radius:14px;background:var(--dark);color:#fff;font-size:14px;font-weight:600;line-height:1.45;box-shadow:0 12px 30px rgba(12,40,48,.35);animation:tin .2s ease-out}
.toast.bad{background:var(--danger)}.toast.ok{background:var(--ok)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* login & onboarding */
.login{min-height:100vh;display:flex;flex-wrap:wrap;background:var(--bg)}
.login-l{flex:1 1 520px;min-width:0;background:var(--dark);color:#fff;padding:56px 64px;display:flex;flex-direction:column;justify-content:space-between;gap:40px}
.login-l h1{font-size:56px;line-height:1.05;font-weight:700;letter-spacing:-.02em;max-width:560px}
.login-r{flex:1 1 480px;min-width:0;display:flex;align-items:center;justify-content:center;padding:48px 32px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:14px;width:100%;min-height:56px;padding:0 20px;border:1.5px solid var(--line2);border-radius:14px;background:#fff;color:var(--ink);font-family:inherit;font-size:16px;font-weight:700;text-decoration:none}
.gbtn:hover{background:#F7FAFA;border-color:var(--pri)}
.pill{padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.1);font-size:13px;font-weight:600;color:var(--teal-l)}
.steps{list-style:none;margin:0 0 36px;padding:0;display:flex;flex-wrap:wrap;gap:12px 28px}
.steps li{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--muted)}
.steps li.done{color:var(--pri-t);font-weight:700}.steps li.cur{color:var(--ink);font-weight:800}
.steps .n{width:32px;height:32px;border-radius:50%;background:var(--line);color:var(--muted);display:flex;align-items:center;justify-content:center}
.steps .done .n{background:var(--pri);color:#fff}.steps .cur .n{background:var(--amb);color:#1B1203}
.wrap{max-width:1180px;margin:0 auto;padding:40px 48px 56px}
.status-box{max-width:520px;margin:12vh auto;padding:36px;text-align:center}

/* kertas cetak */
.paper{background:#fff;color:#111;padding:40px 44px;border-radius:6px;box-shadow:0 24px 60px rgba(0,0,0,.35);min-width:780px;font-size:13px;box-sizing:border-box;margin:0 auto}
/* pratinjau sebanding dengan lebar cetak A4 (lanskap 277 mm, potret 190 mm bersih) */
.paper.ori-l{width:1080px;min-width:1080px}.paper.ori-p{width:760px;min-width:760px}
.paper .ttl{text-align:center;margin-bottom:20px}
.paper .ttl b{font-size:17px;letter-spacing:.03em}
.paper .meta{line-height:1.8;margin-bottom:16px}
.paper .meta span{display:inline-block;width:110px}
.kop{display:flex;align-items:center;gap:14px;padding-bottom:8px;border-bottom:2px solid #111;margin-bottom:20px}
.kop img{width:64px;height:73px;object-fit:contain;flex:none}
.kop .kt{flex:1;text-align:center;line-height:1.35}
.kop .k1{font-size:14px}.kop .k2{font-size:17px}.kop .k3{font-size:17px;font-weight:700}.kop .k4{font-size:11px;font-weight:700}.kop .k5{font-size:11px}
.kop::after{content:"";width:64px;flex:none}
.pt{width:100%;border-collapse:collapse;font-size:12px;line-height:1.45;table-layout:fixed}
.pt thead{display:table-header-group}.pt tfoot{display:table-footer-group}
.pt td,.pt th{overflow-wrap:break-word;word-break:normal}
.pt th{font-size:11px;hyphens:none}
.ori-p .pt{font-size:11px}.ori-p .pt th,.ori-p .pt td{padding:5px 6px}
.pt th,.pt td{border:1px solid #9AA9B1;padding:7px 9px;vertical-align:top;text-align:left}
.pt th{background:#EEF2F4;font-weight:800}
.pt td.n,.pt th.n{text-align:right}
/* satu baris kegiatan TIDAK PERNAH terpotong di antara dua halaman: bila tidak muat, seluruh baris pindah ke halaman berikutnya (header tabel diulang otomatis) */
.pt tr,.pt td,.pt th{break-inside:avoid;page-break-inside:avoid}
.pt img{break-inside:avoid;page-break-inside:avoid}
.pt tr.grp-j,.pt tr.grp-k,.pt thead tr{break-inside:avoid;page-break-inside:avoid;break-after:avoid;page-break-after:avoid}
.pt .ph{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.pt .ph img{width:100%;height:auto;max-height:170px;object-fit:contain;background:#F2F5F7;border-radius:4px;border:1px solid #CBD6DC}
.sign{display:flex;justify-content:flex-end;margin-top:36px;line-height:1.5;page-break-inside:avoid}
.sign>div{width:270px;text-align:center}
.ttd-sign{height:78px;display:flex;align-items:center;justify-content:center;margin:2px 0}
.ttd-sign img{max-height:78px;max-width:240px;object-fit:contain}
.ttd-prev{height:96px;border:1.5px dashed var(--line2);border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;background:repeating-conic-gradient(#F2F5F7 0 25%,#fff 0 50%) 0 0/16px 16px}
.ttd-prev img{max-height:84px;max-width:90%;object-fit:contain}
#printRoot{display:none}

/* bilah tanggal & aksi halaman Laporan */
.lap-bar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:20px}
.lap-tgl,.lap-aksi{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.lap-label{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 16px;border-radius:12px;background:#fff;border:1px solid var(--line2);font-weight:700}
.lap-date{width:172px}
.lap-badges{display:flex;gap:8px;flex-wrap:wrap}
.lap-hapus{color:var(--danger)}
.lap-sek{display:contents}
@media (max-width:1100px){.main{padding:28px 24px 48px}.login-l{padding:40px 32px}.login-l h1{font-size:42px}}
@media (max-width:900px){
  .side{display:none}
  .main{padding:20px 16px 96px}
  .head h1{font-size:26px}
  .head{position:relative}
  .head-prof{display:flex;position:absolute;top:0;right:0;border:0;background:none;padding:0;cursor:pointer;z-index:2}
  .head>div:first-of-type{padding-right:52px}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--dark);padding:6px 8px calc(6px + env(safe-area-inset-bottom));gap:2px;overflow-x:auto}
  .bottomnav button{flex:1 0 54px;min-height:54px;padding:0 2px;border:0;border-radius:12px;background:transparent;color:#C7D8DC;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
  .bottomnav button.on{background:var(--amb);color:#1B1203}
  .hero{padding:22px 20px}.hero h2{font-size:24px}
  .modal-b{padding:16px 16px 22px}.modal-h{padding:18px 16px 0}
  .overlay{padding:16px 10px}
  .login-l{display:none}.login-r{padding:32px 20px}
  .wrap{padding:20px 14px 40px}
  .toast-box{left:12px;right:12px;bottom:84px;max-width:none}
  .paper{min-width:0;padding:20px 16px}
  /* tabel -> kartu */
  .tbl.stack-m thead{display:none}
  .tbl.stack-m,.tbl.stack-m tbody,.tbl.stack-m tr,.tbl.stack-m td{display:block;width:100%}
  .tbl.stack-m tr{border:1px solid var(--line);border-radius:12px;margin:0 0 10px;padding:6px 4px;background:#fff}
  .tbl.stack-m td{border:0;padding:5px 12px}
  .tbl.stack-m td[data-l]::before{content:attr(data-l);display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .tbl.stack-m td.num{text-align:left}
  .trow{grid-template-columns:minmax(0,1fr)!important}
  .trow.h{display:none}
  .entry-in{min-width:0}
  .entry-wrap{overflow:visible}
  .entry{grid-template-columns:minmax(0,1fr)}
  .entry select.field,.entry .pick{max-width:100%;text-overflow:ellipsis}
  .entry>*{min-width:0}
  #pwaPasang{bottom:calc(78px + env(safe-area-inset-bottom))!important}
  .entry>.th-row{display:none}
  .entry-head{display:none}
}
@media print{
  @page{size:A4 landscape;margin:10mm} /* bawaan; ditimpa pilihan orientasi saat mencetak */
  body{background:#fff}
  body>*:not(#printRoot){display:none!important}
  #printRoot{display:block!important}
  #printRoot .paper{box-shadow:none;padding:0;min-width:0;width:auto;max-width:none;border-radius:0}
  #printRoot .kop{margin-bottom:12px}
  #printRoot .paper .ttl{margin-bottom:12px}
  #printRoot .paper .meta{line-height:1.6;margin-bottom:10px}
  #printRoot .pt{line-height:1.35}
  #printRoot .sign{margin-top:20px}
  .toast-box,#loadbar{display:none!important}
}

@media(max-width:900px){
  .lap-bar{display:block}
  .lap-tgl{display:grid;grid-template-columns:44px minmax(0,1fr) 44px auto;gap:8px;margin-bottom:10px}
  .lap-label{grid-column:1/-1;min-height:42px}
  .lap-date{width:100%;min-width:0}
  .lap-badges{grid-column:1/-1}
  .lap-aksi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .lap-aksi>.btn-ghost,.lap-aksi>.btn-primary{width:100%;justify-content:center;padding:0 10px;font-size:15px;min-height:48px;white-space:nowrap}
  .lap-draf{order:1}.lap-kirim{order:2;font-weight:700}
  .lap-sek{display:flex;gap:8px;grid-column:1/-1;order:3;margin-top:2px}
  .lap-sek .btn-ghost{flex:1 1 0;min-width:0;min-height:38px;padding:0 6px;gap:6px;font-size:12.5px;white-space:nowrap;border-color:transparent;background:transparent;color:var(--muted)}
  .lap-sek .lap-hapus{color:var(--danger)}
  .lap-sek .btn-ghost svg{width:15px;height:15px}
}

@media(max-width:900px){
  .kpis{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
  .kpi{padding:14px 16px}
  .kpi .num{font-size:26px}
  .hero{gap:16px}
  .ring{margin:0 auto}
}
@media(min-width:520px) and (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pt tr.grp-j td{background:#DDE7EB;font-size:12.5px}
.pt tr.grp-k td{background:#F2F5F7}

#busyPill{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);z-index:90;display:flex;align-items:center;gap:10px;padding:11px 18px;border-radius:999px;background:var(--dark);color:#fff;font-size:14px;font-weight:700;box-shadow:0 12px 30px rgba(12,40,48,.35);opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
#busyPill.on{opacity:1;transform:translate(-50%,0)}
.toast{display:flex;align-items:flex-start;gap:10px}
.toast .ti{flex:none;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.22);font-size:13px;font-weight:800;line-height:1}
button.hasil-ok{background:var(--ok)!important;color:#fff!important;border-color:var(--ok)!important}
button.hasil-gagal{background:var(--danger)!important;color:#fff!important;border-color:var(--danger)!important}
.photo.upl-ok{outline:3px solid var(--ok)}
@media (max-width:760px){#busyPill{bottom:84px}}
@media print{#busyPill{display:none!important}}
.req{color:var(--danger);font-weight:800;margin-left:2px}
.prog-link{display:block;color:inherit;text-decoration:none;border-radius:10px;padding:2px 6px;margin:0 -6px;cursor:pointer}.prog-link:hover,.prog-link:focus-visible{background:var(--teal-l)}.prog-lihat{color:var(--pri-t);font-weight:700;white-space:nowrap}
/* ---- Laporan: kotak volume & WPT, strip foto (v21) ---- */
.vol-in{width:84px;padding:0 8px;text-align:center}
.vol-w{margin-top:8px;font-size:13px;font-weight:800;color:var(--pri)}
.vol-s{font-size:11px;font-weight:600}
.foto-hapus{margin-left:auto}
@media(max-width:900px){
  /* WPT berada di sisi kanan kotak volume, bukan di bawahnya */
  .vol-cell{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:14px;align-items:center}
  .vol-cell .vol-in{grid-row:1/3;grid-column:1}
  .vol-cell .vol-w{grid-column:2;grid-row:1;margin:0;align-self:end;font-size:15px}
  .vol-cell .vol-s{grid-column:2;grid-row:2;align-self:start;font-size:12px}
  .vol-cell .errtxt{grid-column:1/-1;grid-row:3}
  /* strip foto: judul satu baris, dua tombol tambah foto sejajar, tombol hapus di kanan */
  .photos>.th{flex:0 0 100%;margin:0 0 2px!important}
  .photos>.addphoto{flex:1 1 calc(50% - 5px);min-width:0;min-height:72px;padding:0 10px;gap:8px;justify-content:flex-start;line-height:1.3}
  .photos>.addphoto svg{flex:none;width:20px;height:20px}
  .photos>.errtxt{flex:0 0 100%;margin:0}
  .photos>.foto-hapus{flex:0 0 100%;display:flex;justify-content:flex-end;margin:0}
}
/* ---- Ponsel/tablet: tabel menjadi kartu yang tertata (v21) ---- */
@media(max-width:900px){
  .tbl.kartu-tugas td,.tbl.kartu-riwayat td,.tbl.kartu-2k td{padding:0;min-width:0;width:auto}
  .tbl.kartu-tugas tr,.tbl.kartu-riwayat tr{display:grid;gap:10px 12px;padding:14px;border-radius:14px;margin:0 0 12px}
  .tbl.kartu-tugas td[data-l]::before,.tbl.kartu-riwayat td[data-l]::before,.tbl.kartu-2k td[data-l]::before{font-size:10.5px;margin-bottom:2px}
  /* Tugas jabatan: [jenis | aksi] / kegiatan / [aktivitas | WPT] / progres */
  .tbl.kartu-tugas tr{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"jenis aksi" "keg keg" "akt wpt" "prog prog"}
  .tbl.kartu-tugas td[data-l="Jenis"]{grid-area:jenis;align-self:center}
  .tbl.kartu-tugas td[data-l="Aksi"]{grid-area:aksi;justify-self:end}
  .tbl.kartu-tugas td[data-l="Kegiatan"]{grid-area:keg;font-size:14.5px;line-height:1.45}
  .tbl.kartu-tugas td[data-l="Aktivitas"]{grid-area:akt}
  .tbl.kartu-tugas td[data-l="Total WPT"]{grid-area:wpt}
  .tbl.kartu-tugas td[data-l="Progres target"]{grid-area:prog;min-width:0!important;padding-top:10px;border-top:1px dashed var(--line2)}
  .tbl.kartu-tugas td[data-l="Jenis"]::before,.tbl.kartu-tugas td[data-l="Kegiatan"]::before,.tbl.kartu-tugas td[data-l="Aksi"]::before{display:none}
  .tbl.kartu-tugas td[data-l="Aktivitas"],.tbl.kartu-tugas td[data-l="Total WPT"],
  .tbl.kartu-riwayat td[data-l="Volume"],.tbl.kartu-riwayat td[data-l="WPT"],.tbl.kartu-riwayat td[data-l="Foto"]{background:#F2F5F7;border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px}
  /* Riwayat aktivitas: [tanggal | status] / kegiatan / aktivitas+uraian / [volume | WPT | foto] / aksi */
  .tbl.kartu-riwayat tr{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:"tgl tgl sts" "keg keg keg" "akt akt akt" "vol wpt foto" "aks aks aks"}
  .tbl.kartu-riwayat td[data-l="Tanggal"]{grid-area:tgl}
  .tbl.kartu-riwayat td[data-l="Status"]{grid-area:sts;justify-self:end;align-self:start}
  .tbl.kartu-riwayat td[data-l="Kegiatan"]{grid-area:keg;font-size:13px;color:var(--muted);line-height:1.4}
  .tbl.kartu-riwayat td[data-l="Aktivitas"]{grid-area:akt;padding-top:10px;border-top:1px dashed var(--line2);overflow-wrap:anywhere}
  .tbl.kartu-riwayat td[data-l="Volume"]{grid-area:vol}
  .tbl.kartu-riwayat td[data-l="WPT"]{grid-area:wpt}
  .tbl.kartu-riwayat td[data-l="Foto"]{grid-area:foto}
  .tbl.kartu-riwayat td[data-l="Aksi"]{grid-area:aks}
  .tbl.kartu-riwayat td[data-l="Aksi"] .btn-ghost{width:100%;justify-content:center;min-height:40px}
  .tbl.kartu-riwayat td[data-l="Tanggal"]::before,.tbl.kartu-riwayat td[data-l="Status"]::before,.tbl.kartu-riwayat td[data-l="Aktivitas"]::before,.tbl.kartu-riwayat td[data-l="Aksi"]::before,.tbl.kartu-riwayat td[data-l="Kegiatan"]::before{display:none}
  /* Rekap bulanan & tabel ringkas: dua kolom */
  .tbl.kartu-2k tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px;padding:14px}
  .tbl.kartu-2k td:first-child,.tbl.kartu-2k td:last-child{grid-column:1/-1}
  .tbl.kartu-2k td:first-child{font-size:15px}.tbl.kartu-2k td:first-child::before{display:none}
  .tbl.kartu-2k td:last-child::before{display:none}
  .tbl.kartu-2k td:last-child .btn-ghost{width:100%;justify-content:center;min-height:40px}
}

/* ---------- Penyimpanan token masuk ----------
   Token disimpan di localStorage agar aplikasi yang tertutup tidak sengaja (tab/PWA ditutup, peramban dimuat ulang) langsung
   terbuka tanpa masuk lagi. Dibuang saat "Keluar", saat server menolak token, atau bila sudah kedaluwarsa:
   token sesi NIP ("S.") habis bila tidak dipakai SESI_MS (sama dengan server, 6 jam, diperpanjang tiap pemakaian);
   ID token Google habis menurut waktu "exp" di dalamnya (±1 jam; setelah itu Google mencoba masuk otomatis). */
const KUNCI_TOKEN = 'silahar_token', SESI_MS = 6 * 3600 * 1000;
function expJwt(t) { try { const p = JSON.parse(atob(String(t).split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); return (Number(p.exp) || 0) * 1000; } catch (e) { return 0; } }
function simpanToken(t) { try { localStorage.setItem(KUNCI_TOKEN, JSON.stringify({ t: t, w: Date.now() })); sessionStorage.removeItem(KUNCI_TOKEN); } catch (e) { try { sessionStorage.setItem(KUNCI_TOKEN, t); } catch (e2) { /* abaikan */ } } }
function hapusToken() { try { localStorage.removeItem(KUNCI_TOKEN); } catch (e) { /* abaikan */ } try { sessionStorage.removeItem(KUNCI_TOKEN); } catch (e) { /* abaikan */ } }
function bacaToken() {
  let t = null, w = Date.now();
  try { const j = JSON.parse(localStorage.getItem(KUNCI_TOKEN) || 'null'); if (j && j.t) { t = j.t; w = j.w || 0; } } catch (e) { /* abaikan */ }
  if (!t) { try { t = sessionStorage.getItem(KUNCI_TOKEN) || null; } catch (e) { t = null; } }
  if (!t) return null;
  const kedaluwarsa = String(t).indexOf('S.') === 0 ? (Date.now() - w > SESI_MS) : (expJwt(t) <= Date.now() + 30000);
  if (kedaluwarsa) { hapusToken(); return null; }
  return t;
}
let tokenDiperpanjang = 0;
/** Mencatat pemakaian terakhir token sesi (dipanggil setelah permintaan berhasil; dibatasi sekali per menit). */
function perpanjangToken() {
  if (!S.token || String(S.token).indexOf('S.') !== 0 || Date.now() - tokenDiperpanjang < 60000) return;
  tokenDiperpanjang = Date.now(); simpanToken(S.token);
}

/* ---------- Transport ke Apps Script ---------- */
let busy = 0;
let busyTimer = null;
function setBusy(d) {
  busy = Math.max(0, busy + d); const b = $('#loadbar'); if (b) b.classList.toggle('on', busy > 0);
  // Penanda "Memproses…" melayang: muncul bila proses lebih dari ±0,3 detik, hilang otomatis saat selesai
  let p = $('#busyPill');
  if (!p) { p = document.createElement('div'); p.id = 'busyPill'; p.setAttribute('role', 'status'); p.setAttribute('aria-live', 'polite'); p.innerHTML = '<span class="spin"></span><span>Memproses…</span>'; document.body.appendChild(p); }
  clearTimeout(busyTimer);
  if (busy > 0) busyTimer = setTimeout(() => { if (busy > 0) p.classList.add('on'); }, 300); else p.classList.remove('on');
}

function transport(aksi, payload) {
  return new Promise((resolve) => {
    const gagalJaringan = (m) => resolve({ ok: false, kode: 'JARINGAN', pesan: m || 'Tidak dapat menghubungi server. Periksa koneksi internet lalu coba lagi.' });
    if (CFG.authMode !== 'IDTOKEN' && window.google && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler((r) => resolve(r))
        .withFailureHandler((e) => gagalJaringan(e && e.message ? 'Gagal menghubungi server: ' + e.message : null))
        .api(aksi, payload || {}, (S.token && S.token.indexOf('S.') === 0) ? S.token : '');
      return;
    }
    if (!CFG.apiUrl) { gagalJaringan('URL API belum dikonfigurasi (SILAHAR_CFG.apiUrl).'); return; }
    fetch(CFG.apiUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ aksi: aksi, payload: payload || {}, token: S.token || '' }) })
      .then((r) => r.json()).then(resolve).catch(() => gagalJaringan());
  });
}

/* ---------- Cache bacaan sementara + prefetch (mempercepat tampilan) ----------
   - Disimpan di sessionStorage: hilang saat tab ditutup, sama masa hidupnya dengan token sesi. Dikosongkan saat keluar,
     saat sesi habis, dan setelah operasi tulis apa pun. Server tetap memeriksa izin pada setiap permintaan. */
const CP = 'silahar_c:';
const RUTE_BACA = /^(sesi|dashboard|riwayat|cetak|rekap|ekspor\.csv|admin\.log)$|\.(daftar|ambil)$/;
function kunciCache(aksi, payload) { return CP + (S.token ? S.token.slice(-16) : 'g') + ':' + aksi + '|' + JSON.stringify(payload || {}); }
function bacaCache(k) { try { const s = sessionStorage.getItem(k); return s ? { json: s, data: JSON.parse(s) } : null; } catch (e) { return null; } }
function simpanCache(k, json) { try { sessionStorage.setItem(k, json); } catch (e) { hapusCacheBaca(); } }
function hapusCacheBaca() { try { Object.keys(sessionStorage).filter((k) => k.indexOf(CP) === 0).forEach((k) => sessionStorage.removeItem(k)); } catch (e) { /* abaikan */ } }

const PRE = {}; // permintaan yang sudah dikirim lebih awal: dipakai ulang oleh api() bila aksi + payload sama
const kunciPre = (aksi, payload) => aksi + '|' + JSON.stringify(payload || {});
/** Mengirim permintaan BACA lebih awal agar berjalan paralel dengan permintaan lain. Hasilnya dipakai api() berikutnya yang identik. */
function prefetch(aksi, payload) {
  if (!RUTE_BACA.test(aksi)) return;
  const k = kunciPre(aksi, payload);
  if (PRE[k]) return;
  PRE[k] = { t: Date.now(), p: apiLangsung(aksi, payload) };
}

/** Panggilan ke server. Mengembalikan objek respons mentah {ok,...}. Tidak pernah melempar. */
async function apiLangsung(aksi, payload) {
  setBusy(1);
  const t0 = performance.now();
  try {
    const r = await transport(aksi, payload);
    if (!r || typeof r !== 'object') return { ok: false, kode: 'JARINGAN', pesan: 'Respons server tidak dikenali.' };
    if (r.ok) {
      perpanjangToken();
      if (aksi === 'sesi') simpanCache(kunciCache('sesi', {}), JSON.stringify(r.data));
      else if (!RUTE_BACA.test(aksi)) { hapusCacheBaca(); Object.keys(PRE).forEach((k) => { delete PRE[k]; }); } // setelah menulis, semua bacaan tersimpan & bacaan awal (prefetch) dianggap usang
    }
    try { console.info('[SILAHAR] ' + aksi + ': total ' + Math.round(performance.now() - t0) + ' ms, server ' + (r._ms === undefined ? '?' : r._ms) + ' ms, cache ' + (r._c || '-')); } catch (e) { /* abaikan */ }
    return r;
  } finally { setBusy(-1); }
}

async function api(aksi, payload) {
  const k = kunciPre(aksi, payload), h = PRE[k];
  if (h) { delete PRE[k]; if (Date.now() - h.t < 30000) return h.p; }
  return apiLangsung(aksi, payload);
}

/**
 * Stale-while-revalidate untuk layar baca: bila ada salinan tersimpan, tampil() dipanggil SEGERA dengan salinan itu
 * (dariCache = true), lalu data terbaru diminta ke server dan tampil() dipanggil lagi hanya jika isinya berbeda.
 * Mengembalikan true bila ada sesuatu yang berhasil ditampilkan.
 */
async function apiSWR(aksi, payload, tampil) {
  const k = kunciCache(aksi, payload), lama = bacaCache(k);
  if (lama) tampil(lama.data, true);
  const r = await api(aksi, payload);
  if (r.ok) {
    const json = JSON.stringify(r.data);
    simpanCache(k, json);
    if (!lama || lama.json !== json) tampil(r.data, false);
    return true;
  }
  if (lama && r.kode === 'JARINGAN') { toast('Tidak dapat menyegarkan data. Menampilkan data terakhir.', '', 3500); return true; }
  galatUmum(r);
  return !!lama;
}

/** Menyimpan isi kolom isian (berdasarkan id) di dalam #view, menjalankan fn (yang menggambar ulang), lalu memulihkannya. */
function jagaIsian(fn) {
  const nilai = {};
  $$('#view input[id], #view select[id], #view textarea[id]').forEach((e) => { nilai[e.id] = e.type === 'checkbox' ? e.checked : e.value; });
  const aktif = document.activeElement && document.activeElement.id;
  fn();
  Object.keys(nilai).forEach((id) => { const e = document.getElementById(id); if (!e) return; if (e.type === 'checkbox') e.checked = nilai[id]; else e.value = nilai[id]; });
  if (aktif) { const e = document.getElementById(aktif); if (e && e.focus) { try { e.focus(); } catch (x) { /* abaikan */ } } }
}

/** Mengembalikan data, atau null setelah menampilkan pesan galat yang ramah. */
async function apiOk(aksi, payload, opsi) {
  const r = await api(aksi, payload);
  if (r.ok) return r.data;

  return null;
}

function galatUmum(r) {
  if (['AUTH_DIPERLUKAN'].includes(r.kode)) {
    // sesi/token habis di tengah pemakaian: ingat layar yang sedang dibuka agar kembali ke sana setelah masuk lagi
    // (laporan yang belum disimpan tetap di memori dan dipulihkan bila yang masuk adalah pengguna yang sama)
    if (S.sesi && S.screen && S.screen !== 'login') { S.kembali = { layar: S.screen, email: S.sesi.email }; }
    S.token = null; hapusToken();
    hapusCacheBaca();
    tampilLogin(r.pesan); return;
  }
  if (['MENUNGGU', 'DITOLAK', 'NONAKTIF', 'BELUM_DAFTAR', 'TIDAK_TERDAFTAR'].includes(r.kode)) { hapusCacheBaca(); boot(true); return; }
  if (r.kode === 'GANTI_SANDI') { hapusCacheBaca(); boot(true); return; } // masih memakai kata sandi sementara: muat ulang sesi, dialog ganti sandi dibuka lagi
  toast(r.pesan || 'Terjadi kesalahan.', 'bad');
}

/* ---------- Toast, modal, konfirmasi ---------- */
const TOAST = { ok: 0, bad: 0 }; // pencacah hasil terakhir: dipakai tombol untuk menampilkan tanda berhasil / gagal
function toast(msg, tipe, ms) {
  if (tipe === 'ok') TOAST.ok++; else if (tipe === 'bad') TOAST.bad++;
  const box = $('#toasts'); if (!box) return;
  const el = document.createElement('div');
  el.className = 'toast ' + (tipe || ''); el.setAttribute('role', tipe === 'bad' ? 'alert' : 'status');
  const ik = document.createElement('span'); ik.className = 'ti'; ik.setAttribute('aria-hidden', 'true'); ik.textContent = tipe === 'ok' ? '✓' : tipe === 'bad' ? '✕' : 'ℹ';
  const tx = document.createElement('span'); tx.textContent = msg; el.appendChild(ik); el.appendChild(tx);
  box.appendChild(el);
  setTimeout(() => el.remove(), ms || (tipe === 'bad' ? 6500 : 3200));
}

const modalStack = [];
function bukaModal(id, html, kelas, opsi) {
  tutupModal(id);
  const ov = document.createElement('div');
  ov.className = 'overlay'; ov.dataset.modal = id; if (opsi && opsi.kunci) ov.dataset.kunci = '1';
  ov.innerHTML = '<div class="modal ' + (kelas || '') + '" role="dialog" aria-modal="true" tabindex="-1">' + html + '</div>';
  ov.addEventListener('mousedown', (e) => { if (e.target === ov && !(opsi && opsi.kunci)) tutupModal(id); });
  $('#modals').appendChild(ov);
  modalStack.push(id);
  const d = $('.modal', ov); const f = $('[autofocus],input,select,textarea,button', d); (f || d).focus();
  return ov;
}
function tutupModal(id) {
  const ov = $('#modals [data-modal="' + id + '"]');
  if (ov) ov.remove();
  const i = modalStack.indexOf(id); if (i >= 0) modalStack.splice(i, 1);
}
const modalEl = (id) => $('#modals [data-modal="' + id + '"] .modal');
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && modalStack.length) { const id = modalStack[modalStack.length - 1]; const ovk = $('#modals [data-modal="' + id + '"]'); if (id === 'konfirmasi') konfirmasiSelesai(false); else if (!(ovk && ovk.dataset.kunci)) tutupModal(id); }
});

let konfirmasiResolve = null;

  });
}
function konfirmasiSelesai(v) { tutupModal('konfirmasi'); if (konfirmasiResolve) { const r = konfirmasiResolve; konfirmasiResolve = null; r(v); } }
ACT.konfirmasiYa = () => konfirmasiSelesai(true);

  f(t, e);
});

document.addEventListener('change', (e) => { const t = e.target.closest('[data-ch]'); if (t && CH[t.dataset.ch]) CH[t.dataset.ch](t, e); });

/** Mencegah tombol ditekan berulang selama operasi async berlangsung. */
async function denganTombol(btn, fn) {
  let asal = null, sebelum = null;
  if (btn) {
    if (btn.dataset.sibuk) return; btn.dataset.sibuk = '1'; btn.disabled = true;
    asal = btn.innerHTML; sebelum = { ok: TOAST.ok, bad: TOAST.bad };
    btn.classList.remove('hasil-ok', 'hasil-gagal'); btn.innerHTML = '<span class="spin"></span> Memproses…';
  }
  let galat = false;
  try { return await fn(); } catch (e) { galat = true; toast((e && e.message) || 'Terjadi kesalahan. Coba lagi.', 'bad'); throw e; }
  finally {
    if (btn) {
      delete btn.dataset.sibuk; btn.disabled = false;
      // tanda hasil di tombol: ✓ bila ada pemberitahuan berhasil, ✕ bila ada pemberitahuan gagal; tombol lalu kembali seperti semula
      const gagal = galat || TOAST.bad > sebelum.bad, berhasil = !gagal && TOAST.ok > sebelum.ok;
      if (btn.isConnected && (gagal || berhasil)) {
        btn.classList.add(gagal ? 'hasil-gagal' : 'hasil-ok'); btn.innerHTML = gagal ? '✕ Gagal' : '✓ Berhasil';
        setTimeout(() => { if (btn.isConnected) { btn.classList.remove('hasil-ok', 'hasil-gagal'); btn.innerHTML = asal; } }, 1400);
      } else if (btn.isConnected) { btn.innerHTML = asal; }
    }
  }
}

/* ---------- Unduh berkas ---------- */
function unduh(nama, isi, mime) {
  const blob = new Blob([isi], { type: mime || 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nama;
  document.body.appendChild(a); a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(a.href); }, 1000);
}

/** Awalan apostrof agar sel yang dimulai = + - @ tidak dibaca sebagai rumus oleh Excel. */
function selAman(v) { const s = String(v === null || v === undefined ? '' : v); return /^[=+\-@\t\r]/.test(s) ? "'" + s : s; }

function selectOpts(daftar, terpilih, kosong) {
  return (kosong !== undefined ? '<option value="">' + esc(kosong) + '</option>' : '') +
    daftar.map((o) => { const v = typeof o === 'object' ? o.v : o; const l = typeof o === 'object' ? o.l : o; return '<option value="' + esc(v) + '"' + (String(v) === String(terpilih) ? ' selected' : '') + '>' + esc(l) + '</option>'; }).join('');
}

/* ---------- Boot ---------- */
/** Tanggal hari ini (Asia/Jakarta) dari jam perangkat: dipakai sementara sebelum jawaban server tiba. */
function hariIniLokal() { try { return new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Jakarta' }); } catch (e) { return toIso(new Date(Date.now() + 7 * 3600 * 1000)); } }

/**
 * segar = true: abaikan salinan tersimpan dan tunggu jawaban server (dipakai setelah galat status akun).
 * Jalur cepat: bila sesi ini pernah dimuat (token ada & salinan 'sesi' berstatus SIAP), kerangka dan layar langsung
 * ditampilkan dari salinan, lalu server memverifikasi di belakang layar. Server TETAP memeriksa izin di setiap permintaan.
 */
async function boot(segar) {
  const app = $('#app');
  if (!S.token) {
    S.token = bacaToken();
    if (S.token && CFG.authMode !== 'IDTOKEN' && S.token.indexOf('S.') !== 0) S.token = null;
  }
  if (CFG.authMode === 'IDTOKEN' && !S.token) { hapusCacheBaca(); app.innerHTML = MUAT; tampilLogin(); return; }

  const awal = (!segar && S.token) ? bacaCache(kunciCache('sesi', {})) : null;
  const layarAwal = S.screen && S.screen !== 'login' && S.screen !== 'onboarding' ? S.screen : 'dashboard';
  if (awal && awal.data && awal.data.keadaan === 'SIAP' && !S.kembali && ['dashboard', 'tugas', 'buku', 'laporan'].indexOf(layarAwal) >= 0 && !(awal.data.pengguna && awal.data.pengguna.wajibGantiSandi)) {
    // ----- jalur cepat -----
    S.emailTerakhir = awal.data.email; S.sesi = awal.data; S.today = hariIniLokal();
    document.title = (konf().namaAplikasi || 'SILAHAR') + ' - Laporan Harian ASN';
    S.screen = null; mountShell(); go(layarAwal);
    const r = await api('sesi');
    if (!r.ok) {
      if (r.kode === 'JARINGAN') return; // tetap bekerja dengan tampilan yang ada; permintaan data akan menampilkan galatnya sendiri
      return gagalSesi(r);
    }
    const baru = r.data, lama = awal.data;
    if (baru.email !== lama.email || baru.keadaan !== 'SIAP' || (baru.pengguna && baru.pengguna.wajibGantiSandi)) { hapusCacheBaca(); return selesaiBoot(r, null); }
    S.today = baru.hariIni;
    if (JSON.stringify(baru) !== awal.json) { S.sesi = baru; document.title = (konf().namaAplikasi || 'SILAHAR') + ' - Laporan Harian ASN'; segarkanShell(); }
    return;
  }

  app.innerHTML = MUAT;
  // jalur normal: layar awal (dasbor) diminta SEKALIGUS dengan verifikasi sesi, bukan menunggu satu per satu
  if (S.token && !S.kembali && layarAwal === 'dashboard') prefetch('dashboard', { bulan: (DASH.bulan || hariIniLokal().substring(0, 7)) });
  const r = await api('sesi');
  if (!r.ok) return gagalSesi(r);
  const kembali = S.kembali; S.kembali = null;
  return selesaiBoot(r, kembali);
}

function gagalSesi(r) {
  const app = $('#app');
  if (r.kode === 'AUTH_DIPERLUKAN') { S.token = null; hapusToken(); hapusCacheBaca(); tampilLogin(r.pesan); return; }
  app.innerHTML = '<div class="status-box card"><h2 class="display" style="font-size:24px">Aplikasi belum dapat dibuka</h2><p class="muted" style="margin:12px 0 20px;line-height:1.6">' + esc(r.pesan) + '</p><button class="btn-primary" data-act="muatUlang">Coba lagi</button></div>';
}

function selesaiBoot(r, kembali) {
  if (S.emailTerakhir && S.emailTerakhir !== r.data.email) { resetStatus(); hapusCacheBaca(); simpanCache(kunciCache('sesi', {}), JSON.stringify(r.data)); } // pengguna lain di tab yang sama: buang data milik pengguna sebelumnya
  S.emailTerakhir = r.data.email;
  S.sesi = r.data; S.today = r.data.hariIni;
  document.title = (konf().namaAplikasi || 'SILAHAR') + ' - Laporan Harian ASN';
  const k = r.data.keadaan;
  if (k === 'BELUM_DAFTAR' || k === 'ONBOARDING') return tampilOnboarding();
  if (k === 'SIAP') {
    let layar = S.screen && S.screen !== 'login' && S.screen !== 'onboarding' ? S.screen : 'dashboard';
    let param;
    if (kembali && kembali.email === r.data.email) { layar = kembali.layar; if (layar === 'laporan') param = LAP.tanggal; }
    S.screen = null; // layar dibangun ulang dari awal (shell baru)
    mountShell();
    if (S.sesi.pengguna.wajibGantiSandi) {
      // server menolak semua rute lain sebelum kata sandi sementara diganti: layar tujuan dibuka SESUDAH kata sandi disimpan
      S.layarTunda = { layar: layar, param: param };
      bukaGantiSandi(true);
      return;
    }
    go(layar, param);
    return;
  }
  tampilStatus(k);
}

function pasangTombolGoogle() {
  const mulai = () => {
    if (!window.google || !google.accounts || !google.accounts.id) { setTimeout(mulai, 300); return; }
    google.accounts.id.initialize({
      client_id: CFG.clientId, ux_mode: 'popup',
      callback: async (resp) => {
        // tukarkan ID token Google (±1 jam) dengan token sesi server (6 jam, diperpanjang tiap dipakai) agar tidak sering diminta masuk lagi
        S.token = resp.credential;
        try { const t = await api('tukarGoogle', {}); if (t.ok && t.data && t.data.token) S.token = t.data.token; } catch (e) { /* tetap pakai ID token */ }
        simpanToken(S.token); boot();
      },
      auto_select: true, cancel_on_tap_outside: false // pengguna yang pernah masuk dimasukkan otomatis tanpa klik
    });
    try { google.accounts.id.prompt(); } catch (e) { /* abaikan */ }
    google.accounts.id.renderButton($('#gisBtn'), { theme: 'outline', size: 'large', text: 'signin_with', locale: 'id', width: 360 });
  };
  if (!document.getElementById('gsiLib')) {
    const s = document.createElement('script'); s.id = 'gsiLib'; s.src = 'https://accounts.google.com/gsi/client'; s.async = true; document.head.appendChild(s);
  }
  mulai();
}

/* Katalog IKI: memilih jabatan otomatis mengisi daftar tugas jabatan (sumber: sheet KatalogIKI di Spreadsheet). */
async function obMuatKatalog() {
  const st = $('#obJabStatus');
  if (st) st.innerHTML = 'Memuat daftar jabatan…';
  const r = await api('katalog.daftar', {});
  if (S.screen !== 'onboarding') return;
  if (!r.ok) { // gagal dimuat: tampilkan alasan + tombol coba lagi; pengguna tetap bisa mengetik jabatan manual
    if (st) st.innerHTML = '<span style="color:var(--bad,#b3261e)">Daftar jabatan gagal dimuat: ' + esc(r.pesan || 'kesalahan tidak diketahui') + '</span> <button type="button" class="btn-ghost btn-sm" data-act="obMuatUlang">Coba lagi</button>';
    return;
  }
  const d = r.data;
  if (!d || !d.jabatan || !d.jabatan.length) { if (st) st.innerHTML = 'Katalog jabatan masih kosong. Ketik jabatan secara manual atau hubungi admin. <button type="button" class="btn-ghost btn-sm" data-act="obMuatUlang">Muat ulang</button>'; return; }
  OB.kat = d;
  const dl = $('#obJabList'); if (dl) dl.innerHTML = d.jabatan.map((j) => '<option value="' + esc(j.jabatan) + '"></option>').join('');
  if (st) st.innerHTML = '<label for="obJabPilih" class="th lbl" style="margin-top:4px">Atau pilih dari ' + d.jabatan.length + ' jabatan di katalog</label><select id="obJabPilih" class="field" data-ch="obJabPilih">' + selectOpts(d.jabatan.map((j) => ({ v: j.jabatan, l: j.jabatan })), '', 'Pilih jabatan…') + '</select>';
  obRenderTambahan();
  obCocokkanJabatan();
}
ACT.obMuatUlang = () => obMuatKatalog();
CH.obJabPilih = (el) => { if (!el.value) return; $('#obJab').value = el.value; obCocokkanJabatan(); };
const obCari = (nama) => OB.kat && OB.kat.jabatan.find((j) => j.jabatan.toLowerCase() === String(nama || '').trim().toLowerCase());
function obHapusSumber(src) { OB.tugas = OB.tugas.filter((t) => t.src !== src); }
function obTambahPaket(rhkList, src) {
  rhkList.forEach((r) => r.iki.forEach((k) => {
    if (OB.tugas.some((t) => t.nama.toLowerCase() === k.nama.toLowerCase())) return;
    OB.tugas.push({ jenis: src === 'jab' ? 'Tupoksi' : 'Tugas Tambahan', nama: k.nama, katalogId: k.id, rhk: r.nama, teks: k.teks, target: k.target, satuan: k.satuan, src: src });
  }));
  obUrutkan();
}
/** Urutan tampil: Tupoksi dari jabatan, lalu tugas tambahan, lalu kegiatan manual (pengurutan stabil). */
function obUrutkan() { const r = { jab: 0, tt: 1, manual: 2 }; OB.tugas.sort((a, b) => (r[a.src] ?? 2) - (r[b.src] ?? 2)); }
/** Dipanggil saat isian jabatan berubah / katalog selesai dimuat. */
function obCocokkanJabatan() {
  const box = $('#obKatBox'); if (!box) return;
  const j = obCari($('#obJab').value);
  if (j !== OB.jab) { OB.jab = j || null; OB.varian = 0; obHapusSumber('jab'); }
  if (!j) { box.style.display = 'none'; box.innerHTML = ''; if (OB.kat && $('#obJab').value.trim().length >= 3) { box.style.display = ''; box.innerHTML = '<div class="note warn">Jabatan ini belum ada di katalog IKI. Anda tetap dapat melanjutkan dan menambahkan kegiatan secara manual.</div>'; } obRenderList(); return; }
  if (!OB.tugas.some((t) => t.src === 'jab')) obTambahPaket(j.paket[OB.varian].rhk, 'jab');
  const varian = j.paket.length > 1
    ? '<div style="margin-bottom:12px"><label for="obVarian" class="th lbl">Paket IKI untuk jabatan ini</label><select id="obVarian" class="field" data-ch="obVarian">' + j.paket.map((p, i) => '<option value="' + i + '"' + (i === OB.varian ? ' selected' : '') + '>' + esc(p.varian || 'Umum') + '</option>').join('') + '</select></div>' : '';
  const n = OB.tugas.filter((t) => t.src === 'jab').length;
  box.style.display = '';
  box.innerHTML = varian + '<div class="note">Tugas jabatan <strong>' + esc(j.jabatan) + '</strong>' + (j.paket.length > 1 ? ' (' + esc(j.paket[OB.varian].varian) + ')' : '') + ' dimuat otomatis dari katalog IKI: <strong>' + n + ' IKI</strong> beserta target dan satuannya. Hapus yang tidak sesuai di daftar sebelah kanan.</div>';
  obRenderList();
}

/**
 * Menyiapkan gambar TTD di browser: (opsional) latar terang dijadikan transparan & tepi kosong dipotong,
 * lalu dikecilkan (maks 600x220 px) menjadi PNG kecil agar ringan disimpan & dicetak.
 */
async function siapkanTtd(file, bersihkan) {
  if (!/^image\/(png|jpeg|webp)$/.test(file.type)) throw new Error('Pilih gambar PNG, JPG, atau WebP.');
  const im = await bacaGambar(file);
  const sk0 = Math.min(1, 1600 / Math.max(im.naturalWidth, im.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(im.naturalWidth * sk0)); c.height = Math.max(1, Math.round(im.naturalHeight * sk0));
  const x = c.getContext('2d'); x.drawImage(im, 0, 0, c.width, c.height);
  let sx = 0, sy = 0, sw = c.width, sh = c.height;
  if (bersihkan) {
    const img = x.getImageData(0, 0, c.width, c.height), d = img.data;
    let minX = c.width, minY = c.height, maxX = -1, maxY = -1;
    for (let i = 0; i < d.length; i += 4) {
      const lum = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      if (d[i + 3] < 20 || lum > 185) { d[i + 3] = 0; continue; }       // latar terang -> transparan
      if (lum > 120) d[i + 3] = Math.round(d[i + 3] * (185 - lum) / 65); // tepi goresan halus
      const p = i / 4, px = p % c.width, py = (p - px) / c.width;
      if (px < minX) minX = px; if (px > maxX) maxX = px; if (py < minY) minY = py; if (py > maxY) maxY = py;
    }
    if (maxX < 0) throw new Error('Goresan tanda tangan tidak terdeteksi. Gunakan tinta gelap di atas kertas putih, atau matikan pilihan "Hapus latar putih".');
    x.putImageData(img, 0, 0);
    const m = 8; sx = Math.max(0, minX - m); sy = Math.max(0, minY - m); sw = Math.min(c.width, maxX + m + 1) - sx; sh = Math.min(c.height, maxY + m + 1) - sy;
  }
  const batasKB = ((konf().batas && konf().batas.ttdKB) || 70) * 0.95;
  for (const maks of [[600, 220], [450, 165], [320, 120]]) {
    const sk = Math.min(1, maks[0] / sw, maks[1] / sh);
    const o = document.createElement('canvas'); o.width = Math.max(1, Math.round(sw * sk)); o.height = Math.max(1, Math.round(sh * sk));
    const ox = o.getContext('2d');
    if (!bersihkan) { ox.fillStyle = '#fff'; ox.fillRect(0, 0, o.width, o.height); }
    ox.drawImage(c, sx, sy, sw, sh, 0, 0, o.width, o.height);
    const blob = await new Promise((res) => o.toBlob(res, 'image/png'));
    if (blob && blob.size / 1024 <= batasKB) return blobKeBase64(blob);
  }
  throw new Error('Gambar tanda tangan terlalu rumit/besar. Potong gambar agar hanya berisi tanda tangan.');
}

async function muatRef(paksa) {
  const tugas = (paksa || !S.ref.tugas) ? apiOk('tugas.daftar', {}).then((d) => { if (d) S.ref.tugas = d.tugas; }) : null;
  const kamus = (paksa || !S.ref.kamus) ? apiOk('kamus.daftar', {}).then((d) => { if (d) S.ref.kamus = d; }) : null; // dua permintaan berjalan bersamaan

}

/* ===== 03 laporan harian, foto bukti, pemilih kamus ===== */
const WJB = '<span class="req" title="Wajib diisi" aria-hidden="true">*</span>';
const LAP = { tanggal: null, rows: [], versi: null, status: 'KOSONG', dirty: false, rid: uid(), saving: false, ringkas: { totalWpt: 0 }, bulan: { wpt: 0, minimal: 0 }, peringatan: [], galat: {} };
const FOTO = {};            // FotoID -> data URL thumbnail (foto: gambar kecil; dokumen: halaman depan)
const DOK = {};             // FotoID -> { id, nama, url, mime } untuk lampiran berjenis dokumen
const TAUT = {};            // FotoID -> { id, nama, url } untuk lampiran berjenis tautan (alamat web)
const URL_WEB = /^https?:\/\/[^\s<>"'`]+$/i;
const EKS_DOK = /\.(pdf|docx?|xlsx?|pptx?)$/i;
let rowSeq = 0;
const URL_GAMBAR = /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/;

function tugasAktif() { return (S.ref.tugas || []).filter((t) => t.status === 'AKTIF'); }
function barisBaru(tugasId) {
  const t = tugasAktif();
  return { key: 'n' + (++rowSeq), id: '', tugasId: tugasId || (t[0] ? t[0].id : ''), sumber: '', aktivitasId: '', aktivitas: '', satuan: '', wptSatuan: 0, objek: '', volume: 1, uraian: '', fotoIds: [], naik: 0 };
}
function dariServer(r) {
  (r.dok || []).forEach((d) => { DOK[d.id] = d; });
  (r.tautan || []).forEach((d) => { TAUT[d.id] = d; });
  return { key: r.id, id: r.id, tugasId: r.tugasId, sumber: r.sumber, aktivitasId: r.aktivitasId, aktivitas: r.aktivitas, satuan: r.satuan, wptSatuan: r.wptSatuan, objek: r.objek, volume: r.volume, uraian: r.uraian, fotoIds: r.fotoIds.slice(), naik: 0 };
}
const cariBaris = (key) => LAP.rows.find((r) => r.key === key);
const wptBaris = (r) => Math.round((Number(r.wptSatuan) || 0) * (Number(String(r.volume).replace(',', '.')) || 0));
function terapkanHari(d) {
  LAP.tanggal = d.tanggal; LAP.rows = d.rows.map(dariServer); LAP.versi = d.versi; LAP.status = d.status;
  LAP.ringkas = d.ringkas; LAP.bulan = d.bulan; LAP.peringatan = d.peringatan || []; LAP.dirty = false; LAP.galat = {}; LAP.rid = uid(); hapusDraf(d.tanggal);
  ambilThumbs([].concat(...LAP.rows.map((r) => r.fotoIds)));
}
function tandaiUbah() { LAP.dirty = true; LAP.rid = uid(); const b = $('#lapDirty'); if (b) b.classList.remove('hidden'); jadwalDraf(); }

/* ----- Draf otomatis: pekerjaan yang belum disimpan dicadangkan di perangkat (localStorage) PER TANGGAL,
   dipulihkan bila aplikasi tertutup tak sengaja. Draf satu tanggal tidak pernah menimpa draf tanggal lain. ----- */
const KUNCI_DRAF = 'silahar_draf', DRAF_MS = 7 * 24 * 3600 * 1000;
let drafTimer = null;
const kunciDrafTgl = (tanggal) => KUNCI_DRAF + ':' + tanggal;
/** Semua kunci draf yang ada di perangkat (termasuk format lama satu-slot 'silahar_draf'). */
function kunciDrafSemua() {
  try { return Object.keys(localStorage).filter((k) => k === KUNCI_DRAF || k.indexOf(KUNCI_DRAF + ':') === 0); } catch (e) { return []; }
}
function simpanDraf() {
  clearTimeout(drafTimer);
  if (!LAP.dirty || !LAP.tanggal || !S.sesi || !S.sesi.email) return;
  try {
    localStorage.setItem(kunciDrafTgl(LAP.tanggal), JSON.stringify({ email: S.sesi.email, tanggal: LAP.tanggal, versi: LAP.versi, status: LAP.status, w: Date.now(),
      dok: Object.fromEntries(Object.keys(DOK).filter((k) => LAP.rows.some((r) => r.fotoIds.includes(k))).map((k) => [k, DOK[k]])),
      taut: Object.fromEntries(Object.keys(TAUT).filter((k) => LAP.rows.some((r) => r.fotoIds.includes(k))).map((k) => [k, TAUT[k]])),
      rows: LAP.rows.map((r) => Object.assign({}, r, { naik: 0 })) }));
  } catch (e) { /* penyimpanan penuh / diblokir: abaikan, laporan tetap bisa disimpan manual */ }
}
function jadwalDraf() { clearTimeout(drafTimer); drafTimer = setTimeout(simpanDraf, 400); }
/** Membuang draf satu tanggal; tanpa tanggal: SEMUA draf di perangkat (dipakai saat keluar). */
function hapusDraf(tanggal) {
  clearTimeout(drafTimer);
  kunciDrafSemua().forEach((k) => {
    if (!tanggal) { try { localStorage.removeItem(k); } catch (e) { /* abaikan */ } return; }
    let d = null; try { d = JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { d = null; }
    if (k === kunciDrafTgl(tanggal) || !d || d.tanggal === tanggal) { try { localStorage.removeItem(k); } catch (e) { /* abaikan */ } }
  });
}
/** Mengembalikan draf milik pengguna ini untuk tanggal tertentu, atau (tanpa tanggal) draf terbaru; null bila tidak ada. Draf kedaluwarsa/rusak dibuang. */
function bacaDraf(tanggal) {
  let pilih = null;
  kunciDrafSemua().forEach((k) => {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { d = null; }
    if (!d || !d.email || !d.tanggal || !Array.isArray(d.rows) || Date.now() - (d.w || 0) > DRAF_MS) { try { localStorage.removeItem(k); } catch (e) { /* abaikan */ } return; }
    if (!S.sesi || d.email !== S.sesi.email || (tanggal && d.tanggal !== tanggal)) return;
    if (!pilih || (d.w || 0) > (pilih.w || 0)) pilih = d;
  });
  return pilih;
}
// simpan segera saat aplikasi disembunyikan / ditutup (penting di ponsel: tab bisa dimatikan sistem kapan saja)
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') simpanDraf(); });
window.addEventListener('pagehide', simpanDraf);

async function tampilLaporan(tanggal) {
  const dr0 = !tanggal && !LAP.tanggal && !LAP.dirty ? bacaDraf() : null; // aplikasi baru dibuka & ada draf: kembali ke tanggal draf
  const tgl = tanggal || LAP.tanggal || (dr0 && dr0.tanggal) || S.today;
  // data hari itu diminta SEKALIGUS dengan daftar tugas & kamus (tidak menunggu satu per satu)
  if (!(LAP.dirty && LAP.tanggal === tgl)) prefetch('laporan.ambil', { tanggal: tgl });
  if (!(await muatRef())) return;
  muatRiwayatUraian(true); // di belakang layar; tombol riwayat muncul setelah termuat
  // perubahan yang belum disimpan (mis. sesi habis lalu masuk lagi) dipertahankan, bukan ditimpa data server;
  // penanda versi lama tetap dipakai sehingga tabrakan dengan perubahan dari perangkat lain tetap terdeteksi
  if (LAP.dirty && LAP.tanggal === tgl) {
    if (S.screen !== 'laporan') return;
    renderLaporan(); ambilThumbs([].concat(...LAP.rows.map((r) => r.fotoIds)));
    toast('Perubahan laporan yang belum disimpan dipulihkan. Klik Simpan untuk menyimpannya.', 'ok', 5000);
    return;
  }
  const draf = bacaDraf(tgl);
  await bukaHari(tgl, draf);
}
async function bukaHari(tanggal, draf) {
  const d = await apiOk('laporan.ambil', { tanggal: tanggal });
  if (!d || S.screen !== 'laporan') return;
  terapkanHari(d);
  if (draf && Array.isArray(draf.rows)) { Object.keys(draf.taut || {}).forEach((k) => { const d = draf.taut[k]; if (d && typeof d.url === 'string' && URL_WEB.test(d.url)) TAUT[k] = { id: k, nama: String(d.nama || d.url), url: d.url, polos: d.polos === true }; });
    Object.keys(draf.dok || {}).forEach((k) => { const d = draf.dok[k]; if (d && typeof d.url === 'string' && /^https:\/\/drive\.google\.com\//.test(d.url)) DOK[k] = { id: k, nama: String(d.nama || 'Dokumen'), url: d.url, mime: String(d.mime || '') }; }); // pulihkan pekerjaan yang belum sempat disimpan; versi lama dipakai agar tabrakan data tetap terdeteksi
    LAP.rows = draf.rows.slice(0, 200).map((r) => Object.assign(barisBaru(), r, { naik: 0, fotoIds: Array.isArray(r.fotoIds) ? r.fotoIds : [] }));
    LAP.rows.forEach((r) => { const n = Number(String(r.key).replace(/\D/g, '')) || 0; if (n > rowSeq) rowSeq = n; });
    LAP.versi = draf.versi; LAP.status = draf.status || LAP.status; LAP.dirty = true; simpanDraf();
    ambilThumbs([].concat(...LAP.rows.map((r) => r.fotoIds)));
    renderLaporan(); toast('Pekerjaan yang belum sempat disimpan dipulihkan. Klik Simpan untuk menyimpannya.', 'ok', 6000); return;
  }
  renderLaporan();
}

function ringkasLive() {
  const total = LAP.rows.reduce((a, r) => a + wptBaris(r), 0);
  const akt = LAP.rows.filter((r) => r.aktivitas).length;
  const foto = LAP.rows.reduce((a, r) => a + r.fotoIds.length, 0);
  const bulan = Math.max(0, (LAP.bulan.wpt || 0) - (LAP.ringkas.totalWpt || 0) + total);
  return { total: total, akt: akt, foto: foto, bulan: bulan };
}
function perbaruiRingkas() {

    const bar = e('lapBar'); bar.style.width = Math.min(100, Math.round(s.total / maks * 100)) + '%'; bar.parentElement.classList.toggle('warn', s.total > maks);
    e('lapInfo').textContent = s.akt + ' aktivitas · ' + s.foto + ' lampiran bukti · WPT bulan ini ' + fmtN(s.bulan) + ' / ' + fmtN(min);
    e('lapLebih').classList.toggle('hidden', s.total <= maks);
  }

}

async function prosesDok(r, files) {

  if (files.length > sisa) { toast('Hanya ' + sisa + ' dokumen yang diambil (batas ' + maks + ' lampiran per baris).'); files = files.slice(0, sisa); }

          ambilThumbs([d.fotoId]); // halaman depan (bila Drive sudah membuatnya)
        } else if (!res.ok) { if (['AUTH_DIPERLUKAN', 'NONAKTIF', 'MENUNGGU', 'DITOLAK', 'TIDAK_TERDAFTAR', 'BELUM_DAFTAR'].includes(res.kode)) berhenti = res; else toast(res.pesan, 'bad'); }
      } catch (e) { toast(e.message || 'Dokumen gagal diproses.', 'bad'); }
    }
    r.naik = Math.max(0, r.naik - 1); if (LAP.rows.includes(r) && S.screen === 'laporan') segarkanStrip(r);
  }
  if (berhenti) { galatUmum(berhenti); return; }
  if (sukses < files.length && sukses) toast((files.length - sukses) + ' dari ' + files.length + ' dokumen gagal diunggah.', 'bad');
  if (sukses) { toast(sukses + ' dokumen ditambahkan ke baris ' + (LAP.rows.indexOf(r) + 1) + '. Simpan laporan untuk menerapkan.', 'ok'); perbaruiRingkas(); }
};

/* ----- Tautan bukti (alamat web): disimpan sebagai lampiran baris, tanpa berkas ----- */
/** Merapikan tautan yang ditempel: tanpa awalan dianggap https. Mengembalikan '' bila bukan alamat web. */
const POLA_TANPA_AWALAN = /^[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?)+(:\d+)?([\/?#]|$)/;
function rapikanUrl(s) { s = String(s || '').trim(); if (POLA_TANPA_AWALAN.test(s)) s = 'https://' + s; return URL_WEB.test(s) ? s : ''; }
/** Mengirim satu tautan ke server lalu memasangnya pada baris. Mengembalikan respons server. */
async function kirimTautan(r, url, nama) {
  const res = await api('tautan.tambah', { tanggal: LAP.tanggal, url: url, nama: nama || '', requestId: uid() });
  if (!res.ok) return res;
  const d = res.data; TAUT[d.fotoId] = { id: d.fotoId, nama: d.nama, url: d.url, polos: false }; r.fotoIds.push(d.fotoId);
  tandaiUbah(); segarkanStrip(r); perbaruiRingkas();
  return res;
}
/** Tempel/ketik tautan pada kolom 'Tempel tautan' di kartu baris. */
async function tempelKeBaris(r, input, mentah) {
  const bagian = String(mentah || '').trim().split(/\s+/).filter(Boolean);
  if (!bagian.length) return;
  const urls = unik(bagian.slice(0, 10).map(rapikanUrl));
  if (urls.some((u) => !u)) { toast('Yang ditempel bukan alamat web yang valid (mis. https://drive.google.com/…).', 'bad'); return; }
  const maks = konf().maksFotoPerBaris || 10;
  input.disabled = true; let sukses = 0;
  for (const u of urls) {
    if (r.fotoIds.length + r.naik >= maks) { toast('Maksimal ' + maks + ' lampiran per baris.', 'bad'); break; }
    r.naik++; segarkanStrip(r);
    const res = await kirimTautan(r, u, '');
    r.naik--; segarkanStrip(r);
    if (res.ok) { sukses++; ambilThumbs([res.data.fotoId]); } else { toast(res.pesan || 'Tautan ditolak.', 'bad'); if (res.kode !== 'VALIDASI') { galatUmum(res); break; } }
  }
  const baru = $('[data-tempel="' + r.key + '"]'); if (baru) { baru.value = ''; baru.disabled = false; baru.focus(); }
  if (sukses) toast(sukses + ' tautan ditambahkan. Simpan laporan untuk menerapkan.', 'ok');
}

  const r = cariBaris(t.dataset.tempel); if (!r) return;
  e.preventDefault(); e.stopImmediatePropagation();
  tempelKeBaris(r, t, (e.clipboardData && e.clipboardData.getData('text')) || '');
}, true);
document.addEventListener('keydown', (e) => {
  const t = e.target; if (e.key !== 'Enter' || !t || !t.matches || !t.matches('input[data-tempel]')) return;
  e.preventDefault(); const r = cariBaris(t.dataset.tempel); if (r) tempelKeBaris(r, t, t.value);
});
/* Tempel langsung (Ctrl+V): tautan yang disalin dari mana pun ditempel di halaman Laporan (di luar kolom isian) -> menjadi lampiran

/* ----- validasi lokal (UX) + simpan ----- */
function validasiLokal(status) {
  const g = {}; const maks = konf().wptMaksHarian || 660;
  const draf = status !== 'TERKIRIM'; // draf boleh belum lengkap (mis. baru mengisi foto/dokumen); kelengkapan penuh hanya saat dikirim
  LAP.rows.forEach((r, i) => {
    const e = {};
    const vTeks = String(r.volume === null || r.volume === undefined ? '' : r.volume).replace(',', '.').trim();
    if (!r.tugasId) e.tugasId = 'Pilih kegiatan tugas jabatan.';
    if (!draf && !r.aktivitasId) e.aktivitas = 'Pilih aktivitas dari kamus.';
    const v = Number(vTeks);
    if (draf && !r.aktivitasId && (vTeks === '' || v === 0)) { /* draf tanpa aktivitas: volume boleh belum diisi */ }
    else if (!(v > 0) || !/^\d+(\.\d{1,2})?$/.test(vTeks)) e.volume = 'Isi angka > 0, boleh desimal dengan titik (mis. 1.5).';
    else if (r.aktivitasId && Math.round((Number(r.wptSatuan) || 0) * v) < 1) e.volume = 'Volume terlalu kecil (WPT < 1 menit).';
    if (!draf && r.uraian.trim().length < 5) e.uraian = 'Uraian kegiatan wajib diisi (minimal 5 karakter).';
    if (draf && !r.aktivitasId && !r.uraian.trim() && r.fotoIds.length === 0) e.uraian = 'Baris kosong. Isi aktivitas, uraian, atau lampirkan foto/dokumen/tautan, atau hapus baris ini.';
    if (r.fotoIds.length === 0 && status === 'TERKIRIM') e.foto = 'Bukti wajib dilampirkan sebelum dikirim: minimal 1 foto atau dokumen, atau 1 tautan.';
    if (Object.keys(e).length) g[i + 1] = e;
  });
  const total = LAP.rows.reduce((a, r) => a + wptBaris(r), 0);
  return { g: g, lebih: status === 'TERKIRIM' && total > maks, total: total };
}

ACT.lapSimpan = (btn) => {

  }

    const payload = {

    };

      toast(status === 'TERKIRIM' ? 'Laporan ' + fmtTgl(LAP.tanggal) + ' tersimpan dan terkirim.' : 'Draf laporan ' + fmtTgl(LAP.tanggal) + ' tersimpan.', 'ok');

    $('#btnDraf').disabled = false; $('#btnKirim').disabled = false;
    if (r.kode === 'VALIDASI') {
      LAP.galat = {};
      (r.rinci || []).forEach((g) => { if (g.baris > 0) (LAP.galat[g.baris] = LAP.galat[g.baris] || {})[g.bidang] = g.pesan; });

    } else galatUmum(r);
  });
};

function jabatanSaya() { return (S.sesi && S.sesi.pengguna && S.sesi.pengguna.jabatan) || (S.sesi && S.sesi.jabatan) || ''; }
/** Kelompok efektif sebuah kegiatan = jabatannya. Tanpa jabatan: Tugas Tambahan -> 'Umum'; selain itu -> jabatan utama di profil.
 *  Jabatan pertama (profil, saat mendaftar) memuat Tupoksi; jabatan kedua/ketiga memuat Tugas Tambahan-nya. */
const UMUM = '__umum';
function kelompokTugas(t) {
  const j = String(t.jabatan || '').trim();
  if (j) return j;
  return t.jenis === 'Tugas Tambahan' ? UMUM : String(jabatanSaya() || '').trim();
}
function labelKelompok(t) { const k = kelompokTugas(t); return k === UMUM ? 'Umum (Tugas Tambahan)' : (k || 'Semua jabatan'); }
/** Daftar jabatan yang dikenal: jabatan di profil + jabatan yang sudah dipakai kegiatan. */
function daftarJabatan() {
  const set = {}; const arr = [];
  [jabatanSaya()].concat((TGS.list || []).map((t) => t.jabatan), (S.ref.tugas || []).map((t) => t.jabatan)).forEach((j) => { j = (j || '').trim(); if (j && !set[j.toLowerCase()]) { set[j.toLowerCase()] = 1; arr.push(j); } });
  return arr;
}
/** Opsi <select> kegiatan; dikelompokkan per jabatan bila ada lebih dari satu jabatan. */
function opsiTugas(tugas, terpilih, kosong) {
  const lbl = (t) => ({ v: t.id, l: t.nama + (t.status !== 'AKTIF' ? ' (arsip)' : '') });
  const kel = {}; tugas.forEach((t) => { kel[kelompokTugas(t)] = 1; });
  const kunci = Object.keys(kel).filter((k) => k !== UMUM).sort();
  if (kunci.length + (kel[UMUM] ? 1 : 0) < 2) return selectOpts(tugas.map(lbl), terpilih, kosong);
  const grup = (nama, isi) => isi.length ? '<optgroup label="' + esc(nama) + '">' + selectOpts(isi.map(lbl), terpilih) + '</optgroup>' : '';
  return (kosong !== undefined ? '<option value="">' + esc(kosong) + '</option>' : '') +
    kunci.map((k) => grup(k, tugas.filter((t) => kelompokTugas(t) === k))).join('') + grup('Umum (Tugas Tambahan)', tugas.filter((t) => kelompokTugas(t) === UMUM));
}

/* ----- Isi otomatis dari Katalog IKI (sumber sama dengan pendaftaran awal) ----- */
async function muatKatTugas() {
  if (TGS.kat) return;
  const r = await api('katalog.daftar', {});
  if (!r.ok || !r.data) return;
  TGS.kat = r.data;
  if (S.screen === 'tugas') jagaIsian(renderTugas);

const sama = (a, b) => String(a || '').trim().toLowerCase() === String(b || '').trim().toLowerCase();
/** Paket katalog yang cocok dengan jabatan & jenis yang sedang diisi: [{varian, rhk:[{nama, iki:[]}]}]. */
function paketKatalogCocok() {
  if (!TGS.kat) return [];
  const jab = ($('#tgJabatan') || {}).value, jenis = ($('#tgJenis') || {}).value;
  if (!jab || !jab.trim()) return [];
  if (jenis === 'Tupoksi') { const j = TGS.kat.jabatan.find((x) => sama(x.jabatan, jab)); return j ? j.paket : []; }
  if (jenis === 'Tugas Tambahan') return (TGS.kat.tambahan || []).filter((t) => sama(t.jabatan, jab)).map((t) => ({ varian: t.varian, rhk: t.rhk }));
  return [];
}
function renderKatBox() {
  const box = $('#tgKatBox'); if (!box) return;
  if (!TGS.kat) { box.innerHTML = '<div class="muted" style="font-size:13px"><span class="spin"></span> Memuat katalog IKI…</div>'; return; }
  const paket = paketKatalogCocok(); const jab = $('#tgJabatan').value.trim(), jenis = $('#tgJenis').value;
  if (!paket.length) {
    box.innerHTML = jab && (jenis === 'Tupoksi' || jenis === 'Tugas Tambahan') ? '<div class="note">Jabatan <strong>' + esc(jab) + '</strong> tidak ditemukan di katalog IKI untuk jenis ' + esc(jenis) + '. Isi manual pada formulir di atas, atau pilih jabatan dari daftar saran.</div>' : '';

  // bulan / tahun / rentang saling menggantikan agar tidak membingungkan
  if (k === 'bulan' && t.value) { BK.f.dari = BK.f.sampai = BK.f.tahun = ''; }
  if (k === 'tahun' && t.value) { BK.f.dari = BK.f.sampai = BK.f.bulan = ''; }
  if ((k === 'dari' || k === 'sampai') && t.value) { BK.f.bulan = BK.f.tahun = ''; }
  ['fDari', 'fSampai', 'fBulan', 'fTahun'].forEach((id) => { const e = $('#' + id); if (e) e.value = BK.f[{ fDari: 'dari', fSampai: 'sampai', fBulan: 'bulan', fTahun: 'tahun' }[id]]; });
  if (BK.f.dari && BK.f.sampai && BK.f.dari > BK.f.sampai) { toast('Tanggal awal tidak boleh setelah tanggal akhir.', 'bad'); return; }

function filterKirim(f, ekstra) {
  const o = { dari: f.dari, sampai: f.sampai, bulan: f.bulan, tahun: f.tahun, tugasId: f.tugasId, status: f.status, q: f.q, urut: f.urut };
  return Object.assign(o, ekstra || {});
}

let bkSeq = 0;
async function bkMuat() {
  const box = $('#bkHasil'); if (!box) return;
  const seq = ++bkSeq;
  box.innerHTML = MUAT;
  const d = await apiOk('riwayat', filterKirim(BK.f, { halaman: BK.f.halaman, ukuran: BK.f.ukuran }));
  if (seq !== bkSeq) return; // respons usang diabaikan
  if (!d) { box.innerHTML = '<div class="empty">Gagal memuat riwayat.</div>'; return; }
  BK.data = d; bkGambar();
}

function bkGambar() {
  const d = BK.data, r = d.ringkasan, box = $('#bkHasil');
  const rekap = d.rekapBulanan.map((m) =>

/** Kop surat: logo + nama pemda, dinas, UPT, alamat, kontak (dari Pengaturan, diubah admin). */
function kopHtml(k) {
  k = k || {};
  return '<div class="kop"><img alt="Logo" src="' + LOGO_KOP + '"><div class="kt">' +
    (k.pemprov ? '<div class="k1">' + esc(k.pemprov) + '</div>' : '') + (k.dinas ? '<div class="k2">' + esc(k.dinas) + '</div>' : '') +
    (k.upt ? '<div class="k3">' + esc(k.upt) + '</div>' : '') + (k.alamat ? '<div class="k4">' + esc(k.alamat) + '</div>' : '') +
    (k.kontak ? '<div class="k5">' + esc(k.kontak) + '</div>' : '') + '</div></div>';
