/** Membangun HTML kertas laporan. Semua teks data lewat esc(). */
/** Mengurutkan baris cetak: 'kegiatan' = jabatan, kegiatan tugas jabatan, lalu tanggal; selain itu = tanggal (urutan input). */
function urutkanBaris(rows, urut) {
  const tgl = (a, b) => (a.tanggal < b.tanggal ? -1 : a.tanggal > b.tanggal ? 1 : (a.urutan || 0) - (b.urutan || 0));
  const salin = rows.slice();
  if (urut !== 'kegiatan') return salin.sort(tgl);
  const kunci = (r) => (r.tugasJabatan || '').toLowerCase();
  return salin.sort((a, b) => {
    const ja = kunci(a), jb = kunci(b);
    if (ja !== jb) return !ja ? 1 : !jb ? -1 : ja < jb ? -1 : 1; // baris tanpa jabatan ("Semua jabatan") paling akhir
    const na = (a.tugasNama || '').toLowerCase(), nb = (b.tugasNama || '').toLowerCase();
    if (na !== nb) return na < nb ? -1 : 1;
    return tgl(a, b);
  });
}

/* ----- Orientasi kertas (Lanskap / Potret), diingat per perangkat ----- */
const KUNCI_ORI = 'silahar_orientasi';
function orientasi() { try { return localStorage.getItem(KUNCI_ORI) === 'portrait' ? 'portrait' : 'landscape'; } catch (e) { return 'landscape'; } }
function aturOrientasi(v) { try { localStorage.setItem(KUNCI_ORI, v === 'portrait' ? 'portrait' : 'landscape'); } catch (e) { /* abaikan */ } }
/**
 * Lebar kolom (persen, jumlah 100) agar tabel SELALU memenuhi lebar halaman pada kedua orientasi:
 * kolom teks mendapat ruang terbesar; kolom Foto lebar hanya bila memang ada foto (tidak menyisakan ruang kosong).
 */
function lebarKolom(ori, tampilTgl, adaFoto) {
  const L = ori !== 'portrait';
  const k = { no: L ? 3.5 : 5, tgl: tampilTgl ? (L ? 8.5 : 11) : 0, wpt: L ? 6.5 : 8.5, vol: L ? 6.5 : 8.5, foto: adaFoto ? (L ? 24 : 24) : (L ? 5 : 7) };
  const sisa = 100 - k.no - k.tgl - k.wpt - k.vol - k.foto; // dibagi untuk Kegiatan : Aktivitas & uraian = 1 : 2
  k.keg = Math.round(sisa / 3 * 10) / 10; k.akt = Math.round((sisa - k.keg) * 10) / 10;
  return k;
}

function kertasHtml(o) {
  const tampilTgl = !!o.tampilTgl;
  const ori = o.orientasi || orientasi();
  const adaFoto = !o.tanpaFoto && (o.rows || []).some((r) => (r.fotoIds || []).length);
  const lk = lebarKolom(ori, tampilTgl, adaFoto);
  const colg = '<colgroup><col style="width:' + lk.no + '%">' + (tampilTgl ? '<col style="width:' + lk.tgl + '%">' : '') + '<col style="width:' + lk.keg + '%"><col style="width:' + lk.akt + '%"><col style="width:' + lk.wpt + '%"><col style="width:' + lk.vol + '%"><col style="width:' + lk.foto + '%"></colgroup>';
  const kelompok = o.urut === 'kegiatan';
  const urutan = o.urut ? urutkanBaris(o.rows, o.urut) : o.rows;
  const adaJab = kelompok && urutan.some((r) => r.tugasJabatan);
  const jumlahKol = 6 + (tampilTgl ? 1 : 0);
  const subtotal = {}; // total WPT per kegiatan (per jabatan) untuk baris judul kelompok
  if (kelompok) urutan.forEach((r) => { const k = (r.tugasJabatan || '') + '\u0001' + r.tugasNama; subtotal[k] = (subtotal[k] || 0) + (Number(r.totalWpt) || 0); });
  let jabSkrg = null, tugasSkrg = null;
  const baris = urutan.map((r, i) => {
    let kepala = '';
    if (kelompok) {
      const j = r.tugasJabatan || '';
      if (adaJab && j !== jabSkrg) { kepala += '<tr class="grp-j"><td colspan="' + jumlahKol + '"><b>Jabatan: ' + (j ? esc(j) : 'Semua jabatan') + '</b></td></tr>'; jabSkrg = j; tugasSkrg = null; }
      if (r.tugasNama !== tugasSkrg) { kepala += '<tr class="grp-k"><td colspan="' + jumlahKol + '"><b>Kegiatan: ' + esc(r.tugasNama) + '</b> &mdash; total WPT ' + fmtN(subtotal[j + '\u0001' + r.tugasNama]) + ' menit</td></tr>'; tugasSkrg = r.tugasNama; }
    }
    const fotos = o.tanpaFoto ? '' : (r.fotoIds || []).map((id) => (FOTO[id] && URL_GAMBAR.test(FOTO[id]) ? '<img alt="Foto kegiatan" src="' + FOTO[id] + '">' : '')).join('');
    const tautan = o.tanpaFoto ? '' : (r.tautan || []).map((tt) => '<div class="tl">' + (!tt.polos && FOTO[tt.id] && URL_GAMBAR.test(FOTO[tt.id]) ? '<img alt="Halaman depan tautan" src="' + FOTO[tt.id] + '">' : '') + 'Tautan: <a href="' + esc(tt.url) + '" target="_blank" rel="noopener">' + esc(tt.nama) + '</a><br><span>' + esc(tt.url) + '</span></div>').join('');
    // urutan kolom: No, [Tanggal], Kegiatan, Aktivitas & uraian, WPT, Volume, Foto (kolom tersendiri, gambar cukup besar)
    return kepala + '<tr><td class="n">' + (i + 1) + '</td>' + (tampilTgl ? '<td style="white-space:nowrap">' + esc(fmtTglPendek(r.tanggal)) + '</td>' : '') +
      '<td>' + esc(r.tugasNama) + '</td><td><b>' + esc(r.aktivitas) + '</b>' + (r.objek ? '<br><i>' + esc(r.objek) + '</i>' : '') + '<br>' + br(r.uraian) + '</td>' +
      '<td class="n">' + fmtN(r.totalWpt) + '</td><td class="n">' + fmtV(r.volume) + '</td><td class="f">' + (fotos ? '<div class="ph">' + fotos + '</div>' : '') + tautan + '</td></tr>';
  }).join('');
  const p = o.profil || {};
  const kolom = jumlahKol;
  return '<div class="paper ori-' + (ori === 'portrait' ? 'p' : 'l') + '" data-ori="' + ori + '">' + kopHtml(o.kop) + '<div class="ttl"><b>' + esc(o.judul) + '</b><div>' + esc(o.periode) + '</div></div>' +
    '<div class="meta"><div><span>Nama</span>: ' + esc(p.nama) + '</div><div><span>NIP</span>: ' + esc(p.nip) + '</div><div><span>Jabatan</span>: ' + esc(p.jabatan) + '</div><div><span>Unit kerja</span>: ' + esc(p.unit) + '</div></div>' +
    '<table class="pt">' + colg + '<thead><tr><th class="n">No</th>' + (tampilTgl ? '<th>Tanggal</th>' : '') + '<th>Kegiatan tugas jabatan</th><th>Aktivitas &amp; uraian</th><th class="n">WPT (menit)</th><th class="n">Volume</th><th class="f">Foto</th></tr></thead><tbody>' +
    (baris || '<tr><td colspan="' + kolom + '" style="text-align:center">Tidak ada data.</td></tr>') +
    '<tr><td colspan="' + (kolom - 3) + '" class="n"><b>Total WPT (menit)</b></td><td class="n"><b>' + fmtN(o.totalWpt) + '</b></td><td colspan="2"></td></tr></tbody></table>' +
    (o.minimalBulanan ? '<p style="margin-top:8px">Minimal WPT bulanan: ' + fmtN(o.minimalBulanan) + ' menit' + (o.kurang ? ' — kekurangan ' + fmtN(o.kurang) + ' menit' : ' — terpenuhi') + '. Angka ini ukuran beban waktu kerja, bukan nilai kinerja.</p>' : '') +
    (o.adaDraf ? '<p style="margin-top:6px"><i>Catatan: terdapat baris berstatus Draft yang belum dikirim.</i></p>' : '') +
    '<div class="sign"><div>Pegawai yang melaporkan,' + (p.jabatan ? '<br>' + esc(p.jabatan) : '') +
    // tanda tangan tersimpan (gambar) atau ruang kosong untuk tanda tangan basah; tinggi sama agar tata letak tidak bergeser
    (o.ttd && URL_GAMBAR.test(o.ttd) ? '<div class="ttd-sign"><img alt="Tanda tangan" src="' + o.ttd + '"></div>' : '<div class="ttd-sign"></div>') +
    '<u><b>' + esc(p.nama) + '</b></u><br>NIP ' + esc(p.nip) + '</div></div></div>';
}

/** Mengisi #printRoot lalu membuka dialog cetak browser (pilih "Simpan sebagai PDF" untuk PDF). */
function cetakKertas(html, ori) {
  const root = $('#printRoot');
  root.innerHTML = html;
  // ukuran & arah kertas mengikuti pilihan pengguna (A4 lanskap / potret)
  ori = ori === 'portrait' || ori === 'landscape' ? ori : orientasi();
  let st = document.getElementById('gayaHalaman');
  if (!st) { st = document.createElement('style'); st.id = 'gayaHalaman'; document.head.appendChild(st); }
  st.textContent = '@media print{@page{size:A4 ' + ori + ';margin:10mm}}';
  const bersih = () => { root.innerHTML = ''; window.removeEventListener('afterprint', bersih); };
  window.addEventListener('afterprint', bersih);
  setTimeout(() => window.print(), 150);
}

const CT = { data: null, param: null, mode: null, urut: 'tanggal' };

}

/* ===== Salin teks & Unduh Word =====
 * PDF dari browser menyimpan setiap baris visual sebagai teks terpisah, jadi menyalin kalimat dari PDF menghasilkan baris putus-putus.
 * Dua jalan keluar: "Salin teks" (teks utuh, satu paragraf per uraian) dan "Unduh Word" (paragraf asli, bisa disalin per kalimat). */
const rapatkan = (v) => String(v === null || v === undefined ? '' : v).replace(/\s*\n\s*/g, ' ').replace(/[ \t]{2,}/g, ' ').trim();
function teksLaporan() {
  const d = CT.data; if (!d) return '';
  const rows = CT.mode === 'bulan' ? urutkanBaris(d.rows, CT.urut) : d.rows;
  const judul = CT.mode === 'tugas' ? String((d.tugas && d.tugas.nama) || '').toUpperCase() + ' - ' + fmtBulan(CT.bulan) : (CT.judul || 'LAPORAN AKTIFITAS HARIAN') + ' - ' + (CT.periode || '');
  const p = d.profil || {};
  const out = [judul, 'Nama: ' + (p.nama || ''), 'NIP: ' + (p.nip || ''), 'Jabatan: ' + (p.jabatan || '')];
  rows.forEach((r, i) => {
    const kepala = (i + 1) + '. ' + tglDua(r.tanggal) + (CT.mode === 'tugas' ? '' : ' - ' + rapatkan(r.tugasNama)) + ' - ' + rapatkan(r.aktivitas) + (r.objek ? ' (' + rapatkan(r.objek) + ')' : '');
    out.push('', kepala, rapatkan(r.uraian));
    (r.tautan || []).forEach((t) => out.push('Tautan: ' + t.url));
    (r.dok || []).forEach((t) => out.push('Dokumen: ' + rapatkan(t.nama) + (t.url ? ' ' + t.url : '')));
  });
  return out.join('\n');
}
async function salinKeKlip(teks) {
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(teks); return true; } } catch (e) { /* coba cara lama */ }
  const ta = document.createElement('textarea'); ta.value = teks; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;left:-9999px;top:0';
  document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; } ta.remove(); return ok;
}
ACT.ctSalin = async () => {
  const t = teksLaporan(); if (!t) return;
  const berhasil = await salinKeKlip(t);

/* ===== Cetak bulanan per kegiatan (tugas jabatan / IKI) + Berita Acara =====
 * Susunan mengikuti contoh "Laporan Dukungan ...": halaman daftar (No, Tanggal, Nama Kegiatan, Foto Dokumentasi) lalu halaman Berita Acara.
 * Isi sepenuhnya dari laporan harian kegiatan tersebut pada bulan terpilih. Dokumen lampiran tampil sebagai halaman depan + tautan. */
const ROMAWI = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII'];
const dua = (n) => String(n).padStart(2, '0');
function tglDua(iso) { const d = parseIso(iso); return dua(d.getUTCDate()) + ' ' + BULAN[d.getUTCMonth()].substring(0, 3) + ' ' + d.getUTCFullYear(); }
function akhirBulanIso(b) { const p = b.split('-').map(Number); return b + '-' + dua(new Date(Date.UTC(p[0], p[1], 0)).getUTCDate()); }
/** Tanggal Berita Acara bawaan: akhir bulan laporan (atau hari ini bila bulan itu masih berjalan). */
function tglBaBawaan(bulan) { const h = S.today || hariIniLokal(); const ak = akhirBulanIso(bulan); return h.substring(0, 7) === bulan && h < ak ? h : ak; }

function sel_foto(r) {
  const gambar = [], dok = [];
  (r.fotoIds || []).forEach((id) => {
    const u = FOTO[id];
    const d = (r.dok || []).find((x) => x.id === id);
    if (d) dok.push('<div class="dk">' + (u && URL_GAMBAR.test(u) ? '<img alt="Halaman depan dokumen" src="' + u + '">' : '<div class="dk-x">' + esc(ekstDok(d.nama)) + '</div>') +
      '<a href="' + esc(d.url) + '" target="_blank" rel="noopener">' + esc(d.nama) + '</a><div class="dk-u">' + esc(d.url) + '</div></div>');
    else if (u && URL_GAMBAR.test(u)) gambar.push('<img alt="Foto kegiatan" src="' + u + '">');
  });
  (r.tautan || []).forEach((tt) => { const u = tt.polos ? '' : FOTO[tt.id]; dok.push('<div class="dk">' + (u && URL_GAMBAR.test(u) ? '<img alt="Halaman depan tautan" src="' + u + '">' : '') + '<a href="' + esc(tt.url) + '" target="_blank" rel="noopener">' + esc(tt.nama) + '</a><div class="dk-u">' + esc(tt.url) + '</div></div>'); });
  return (gambar.length ? '<div class="ph">' + gambar.join('') + '</div>' : '') + dok.join('');
}

/* Nomor Berita Acara otomatis: KODE/BULAN-ROMAWI/TAHUN/SINGKATAN-UNIT, mis. RAPAT/IX/2026/UPT-RSBD.
 * Bulan & tahun mengikuti Tanggal Berita Acara (berubah otomatis saat tanggal diubah). KODE = huruf awal nama kegiatan; SINGKATAN = pengaturan SINGKATAN_UNIT
 * atau, bila kosong, huruf awal nama instansi setelah "UPT" (tanpa kata terakhir yang umumnya nama kota). Nomor tetap bisa diketik manual. */
const KATA_ABAIKAN = ['dan', 'yang', 'di', 'ke', 'dari', 'untuk', 'dengan', 'pada', 'atau', 'serta', 'dalam', 'oleh', 'the', '&'];
const awalKata = (teks) => String(teks || '').replace(/[^A-Za-z0-9 ]+/g, ' ').split(/\s+/).filter((w) => w && !KATA_ABAIKAN.includes(w.toLowerCase()));
function kodeKegiatan(nama) { const k = awalKata(nama).map((w) => w[0].toUpperCase()).join(''); return (k || 'BA').substring(0, 6); }
function singkatanUnit(kop) {
  if (kop && kop.singkatan) return String(kop.singkatan).trim();
  const w = awalKata(kop && kop.upt); if (!w.length) return '';
  const jenis = w[0].toUpperCase() === 'UPT' || w[0].toUpperCase() === 'UPTD' ? w[0].toUpperCase() : '';
  const isi = jenis ? w.slice(1) : w;
  const pakai = isi.length > 3 ? isi.slice(0, -1) : isi; // kata terakhir (nama kota) dibuang bila namanya panjang
  const k = pakai.map((x) => x[0].toUpperCase()).join('');
  return jenis ? jenis + '-' + k : k;
}
function nomorOtomatis(d, tglBa) {
  const dt = parseIso(tglBa), s = singkatanUnit(d.kop);
  return [kodeKegiatan((d.tugas || {}).nama), ROMAWI[dt.getUTCMonth()], dt.getUTCFullYear(), s].filter((x) => x !== '').join('/');
}

const PS = { d: null };
const PS_KOP = [
  ['NAMA_PEMPROV', 'Kop baris 1: Pemerintah daerah'], ['NAMA_DINAS', 'Kop baris 2: Dinas'], ['NAMA_INSTANSI', 'Kop baris 3: Nama UPT (juga tampil di aplikasi)'],
  ['ALAMAT_KOP', 'Kop: Alamat'], ['KONTAK_KOP', 'Kop: Telepon / laman (boleh kosong)']
];
function kopDariForm0(n) { return { pemprov: n.NAMA_PEMPROV, dinas: n.NAMA_DINAS, upt: n.NAMA_INSTANSI, alamat: n.ALAMAT_KOP, kontak: n.KONTAK_KOP }; }
function kopDariForm() { return { pemprov: $('#ps_NAMA_PEMPROV').value, dinas: $('#ps_NAMA_DINAS').value, upt: $('#ps_NAMA_INSTANSI').value, alamat: $('#ps_ALAMAT_KOP').value, kontak: $('#ps_KONTAK_KOP').value }; }
INP.psKop = () => { const b = $('#psKopPrev'); if (b) b.innerHTML = kopHtml(kopDariForm()); };
const PS_FIELD = [
  ['NAMA_APLIKASI', 'Nama aplikasi', 'teks'],
  ['SINGKATAN_UNIT', 'Singkatan unit untuk nomor Berita Acara (mis. UPT-RSBD; kosong = otomatis)', 'teks'],
  ['WA_ADMIN', 'Nomor WhatsApp admin (untuk tombol "Hubungi admin")', 'teks'], ['OPD_KAMUS', 'OPD kamus yang dipakai', 'teks'], ['OPD_UMUM', 'OPD kamus umum', 'teks'],
  ['WPT_MAKS_HARIAN', 'Batas WPT harian (menit)', 'int'], ['WPT_MIN_BULANAN', 'Minimal WPT bulanan (menit)', 'int'],
  ['MAKS_FOTO_PER_BARIS', 'Maks. foto per baris laporan', 'int'],
  ['PENDAFTARAN_MANDIRI', 'Izinkan pendaftaran mandiri (email belum terdaftar boleh mendaftar)', 'yn'],
  ['PERLU_PERSETUJUAN', 'Pendaftaran baru perlu persetujuan admin', 'yn'],
  ['ADMIN_LIHAT_DETAIL', 'Admin boleh melihat rincian laporan ASN (tercatat di log)', 'yn'],
  ['AI_AKTIF', 'Tombol "Rapikan dengan AI" pada uraian (perlu kunci API di Script Properties)', 'yn']
];
async function tampilPengaturan() {
  const d = await apiOk('admin.pengaturan.ambil', {});
  if (S.screen !== 'pengaturan') return; // pengguna sudah pindah halaman: jangan menimpa tampilan lain
  if (!d) { $('#view').innerHTML = gagalMuat(); return; }
  PS.d = d; renderPengaturan();
}
function renderPengaturan() {
  const d = PS.d;
  const f = PS_FIELD.map((x) => {
    const v = d.nilai[x[0]];
    const ket = d.keterangan[x[0]] ? '<div class="muted" style="font-size:12px;margin-top:4px">' + esc(d.keterangan[x[0]]) + '</div>' : '';

    return '<div style="flex:1 1 320px"><label class="th lbl" for="ps_' + x[0] + '">' + esc(x[1]) + '</label>' + input + '<div class="errtxt" data-e="' + x[0] + '"></div>' + ket + '</div>';
  }).join('');

    '<div class="row" style="align-items:flex-start;gap:16px">' + fk + '</div><div class="th" style="margin:18px 0 8px">Pratinjau kop</div><div id="psKopPrev" style="background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;color:#111">' + kopHtml(kopDariForm0(d.nilai)) + '</div></div>' +
    '<div class="card" style="padding:22px"><div class="row" style="align-items:flex-start;gap:20px">' + f + '</div></div>' +
    '<div class="card" style="padding:22px"><h2 class="display" style="font-size:20px;font-weight:700">Daftar unit kerja</h2><p class="muted" style="font-size:13px;margin:6px 0 12px">Satu unit per baris. Dipakai sebagai pilihan pada pendaftaran dan profil ASN, serta filter rekap.</p>' +
    '<textarea id="ps_UNIT_KERJA" class="field" rows="8" style="padding-top:10px">' + esc((d.unitKerja || []).join('\n')) + '</textarea><div class="errtxt" data-e="UNIT_KERJA"></div></div>' +
    '<div class="row end"><button class="btn-primary" data-act="psSimpan">Simpan pengaturan</button></div>' +
    '<div class="note">ID spreadsheet, folder foto, mode login, dan admin awal diatur di <b>Script Properties</b> (Apps Script), bukan di sini, demi keamanan.</div></div>';
}
ACT.psSimpan = (btn) => denganTombol(btn, async () => {
  $$('#view [data-e]').forEach((x) => { x.textContent = ''; });
  const nilai = {}; PS_FIELD.concat(PS_KOP).forEach((x) => { nilai[x[0]] = $('#ps_' + x[0]).value; });
  nilai.UNIT_KERJA = $('#ps_UNIT_KERJA').value.split('\n');

  // ambil ulang konfigurasi publik (batas WPT, maks foto, unit kerja, foto wajib, AI, kop, OPD) agar semua layar langsung memakai nilai baru
  const s = await api('sesi', {});
  if (s.ok) { S.sesi = s.data; S.today = s.data.hariIni; document.title = (konf().namaAplikasi || 'SILAHAR') + ' - Laporan Harian ASN'; }
  S.ref.kamus = null; // daftar kamus bergantung pada OPD
  segarkanShell(); renderPengaturan(); toast('Pengaturan disimpan dan langsung berlaku.', 'ok', 4000);
});
